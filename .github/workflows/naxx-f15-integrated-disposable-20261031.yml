name: "F15 integrated disposable runner (synthetic, NO HOST)"

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "tools/f15/**"
      - "tests/f15_**"
      - "tests/test_f15_**"
      - "docs/research/F15-INTEGRATED-DISPOSABLE-RUNNER.md"
      - ".github/workflows/naxx-f15-integrated-disposable-20261031.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f15-integrated-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  BASE_252: 90e269d4f43bb653ec7979ec7a0a55e713ef8809

jobs:
  integrated-synthetic:
    name: "Inherited 101 + integrated runner + mutants"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: "Exact head, child of #252, added-path allowlist"
        # Frozen five-path assertion applies ONLY to the original #256 feature branch.
        # Downstream PRs retain every inherited synthetic regression step.
        if: >-
          (github.event_name == 'pull_request' && github.head_ref == 'claude/cs03-f15-integrated-disposable-20261031') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/claude/cs03-f15-integrated-disposable-20261031')
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "$BASE_252" HEAD
          git diff --quiet "$BASE_252" HEAD -- src conf data tools
          python3 - <<'PY'
          import os, subprocess
          base = os.environ["BASE_252"]
          rows = subprocess.check_output(["git", "diff", "--name-status", base, "HEAD"], text=True).splitlines()
          actual = {tuple(r.split("\t")) for r in rows}
          allowed = {("A", p) for p in (
              "tests/f15_integrated_disposable_runner.py",
              "tests/test_f15_integrated_disposable_runner.py",
              "tests/f15_integrated_runner_mutants.py",
              "docs/research/F15-INTEGRATED-DISPOSABLE-RUNNER.md",
              ".github/workflows/naxx-f15-integrated-disposable-20261031.yml",
          )}
          assert actual == allowed, (actual, allowed)
          print("PASS: five added test/doc/CI paths; #249-#252 files and runtime source unchanged")
          PY
      - name: "CS01 F15 #259 six-path source scope (child branch only)"
        if: github.event_name == 'pull_request' && github.head_ref == 'test/cs01-f15-retained-old-inode-drain-20261031'
        shell: bash
        run: |
          set -euo pipefail
          BASE=c908304ff7248faf852f2e61f16dbe4bc08ce3f2
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --check "$BASE" HEAD
          git diff --quiet "$BASE" HEAD -- src conf data tools
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base = "c908304ff7248faf852f2e61f16dbe4bc08ce3f2"
          changes = subprocess.check_output(["git", "diff", "--name-status", base, "HEAD"], text=True)
          actual = set(tuple(x.split("\t")) for x in changes.splitlines())
          expected = {
              ("M", ".github/workflows/naxx-f15-consented-source-poll-20261031.yml"),
              ("M", ".github/workflows/naxx-f15-integrated-disposable-20261031.yml"),
              ("A", ".github/workflows/naxx-f15-retained-old-inode-20261031.yml"),
              ("A", "docs/research/F15-RETAINED-OLD-INODE-TAIL.md"),
              ("A", "tests/f15_retained_old_inode_poll.py"),
              ("A", "tests/test_f15_retained_old_inode_poll.py"),
          }
          assert actual == expected, (actual, expected)
          p = ".github/workflows/naxx-f15-consented-source-poll-20261031.yml"
          before = subprocess.check_output(["git", "show", base + ":" + p], text=True)
          now = Path(p).read_text()
          freeze = "      - name: Freeze runtime and ancestors; four additions only\n        shell: bash"
          scoped = """      - name: Freeze runtime and ancestors; four additions only
        # Original #258 exact-four-path assertion is specific to its own branch.
        # Keep all 15+16 inherited regression cases active on later child PRs.
        if: >-
          (github.event_name == 'pull_request' && github.head_ref == 'test/cs01-f15-consented-source-poll-20261031') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/test/cs01-f15-consented-source-poll-20261031')
        shell: bash"""
          tail = "      - name: Evidence boundary\n        if: always()"
          test_step = """      - name: Retained old-inode tests on the isolated #259 child only
        if: github.event_name == 'pull_request' && github.head_ref == 'test/cs01-f15-retained-old-inode-drain-20261031'
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" != 0
          python3 -I -B -W error -m unittest discover -s tests -p 'test_f15_retained_old_inode_poll.py' -v
"""
          assert before.count(freeze) == 1 and before.count(tail) == 1
          assert now == before.replace(freeze, scoped).replace(tail, test_step + tail)
          # Frozen original #256 workflow must be identical after removing ONLY
          # this child-only scope step and this child-only test execution step.
          p = ".github/workflows/naxx-f15-integrated-disposable-20261031.yml"
          before = subprocess.check_output(["git", "show", base + ":" + p], text=True)
          now = Path(p).read_text()
          pieces = [
              ('      - name: "CS01 F15 #259 six-path source scope (child branch only)"', '      - name: Not root (so the unreadable-source test runs)'),
              ('      - name: "CS01 #259 fake old-inode rotation tests (child branch only)"', '      - name: Scope of proof'),
          ]
          for start, stop in pieces:
              # Anchor real YAML step lines, not the quoted marker text in this checker.
              assert now.count("\\n" + start + "\\n") == 1 and now.count("\\n" + stop + "\\n") == 1
              left = now.index("\\n" + start + "\\n") + 1
              right = now.index("\\n" + stop + "\\n", left) + 1
              now = now[:left] + now[right:]
          assert now == before, "Inherited #256 workflow changed outside the two named child-only steps"
          print("PASS: exact six paths; two inherited YAML changes only; runtime untouched")
          PY
      - name: Not root (so the unreadable-source test runs)
        run: test "$(id -u)" != 0
      - name: Inherited suites unchanged (38 policy + 29 filesystem + 10 negative + 24 journal)
        run: |
          set -euo pipefail
          for pair in "test_f15_console_archive_policy.py:38" "test_f15_archive_disposable_filesystem.py:29" \
                      "test_f15_disposable_crash_gap_contract.py:10" "test_f15_atomic_journal_disposable.py:24"; do
            file="${pair%%:*}"; n="${pair##*:}"
            python3 -I -B -W error "tests/$file" -v > "/tmp/$file.txt" 2>&1 || { cat "/tmp/$file.txt"; exit 1; }
            grep -Eq "^Ran $n tests in [0-9.]+s\$" "/tmp/$file.txt"
            grep -qx OK "/tmp/$file.txt"
          done
      - name: Integrated runner, 54 end-to-end tests, no skips
        run: |
          set -euo pipefail
          python3 -I -B -W error tests/test_f15_integrated_disposable_runner.py -v > /tmp/runner.txt 2>&1 || { cat /tmp/runner.txt; exit 1; }
          cat /tmp/runner.txt
          grep -Eq '^Ran 54 tests in [0-9.]+s$' /tmp/runner.txt
          grep -qx OK /tmp/runner.txt
          ! grep -Eq 'skipped|^FAILED|^ERROR:' /tmp/runner.txt
      - name: Must-fail mutants (14)
        run: |
          set -euo pipefail
          python3 -I tests/f15_integrated_runner_mutants.py | tee /tmp/mutants.txt
          grep -qx '14/14 mutants caught' /tmp/mutants.txt
      - name: "CS01 #259 fake old-inode rotation tests (child branch only)"
        if: github.event_name == 'pull_request' && github.head_ref == 'test/cs01-f15-retained-old-inode-drain-20261031'
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" != 0
          python3 -I -B -W error -m unittest discover -s tests -p 'test_f15_source_admission.py' -v
          python3 -I -B -W error -m unittest discover -s tests -p 'test_f15_consented_source_poll.py' -v
          python3 -I -B -W error -m unittest discover -s tests -p 'test_f15_retained_old_inode_poll.py' -v
      - name: Scope of proof
        if: always()
        run: |
          echo "All file writes and deletes happened inside runner-owned TemporaryDirectory workspaces."
          echo "Synthetic test fixture only: not a collector, not a service, not operational F15, not crash diagnosis."
          echo "No PM2, tmux, launcher, Worldserver, Authserver, SQL, database, owner file or host touched."
