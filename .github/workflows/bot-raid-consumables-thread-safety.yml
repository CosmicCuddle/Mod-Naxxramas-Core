name: "Bot Consumables map-thread safety (#155)"

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'src/Systems/BotRaidConsumables.cpp'
      - 'src/Systems/ConsumableCooldownStore.h'
      - 'tests/consumable_cooldown_store.cpp'
      - 'tests/test_bot_raid_consumables_thread_safety.py'
      - 'tests/test_mc_gfpp_one_shot.py'
      - 'docs/BOT-RAID-CONSUMABLES-THREAD-SAFETY.md'
      - '.github/workflows/bot-raid-consumables-thread-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naxx-155-consumables-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  source-native-tsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Source contracts (thread safety, GFPP one-shot, Hunter ammo)
        run: |
          python3 -m unittest -v \
            tests/test_bot_raid_consumables_thread_safety.py \
            tests/test_mc_gfpp_one_shot.py \
            tests/test_hunter_ammo_consumables.py
      - name: Native cooldown store tests (C++17, C++20)
        run: |
          set -euo pipefail
          for std in c++17 c++20; do
            g++ -std=$std -Wall -Wextra -Werror -pedantic -pthread \
              -Isrc/Systems tests/consumable_cooldown_store.cpp -o /tmp/ccs_$std
            /tmp/ccs_$std
          done
      - name: ThreadSanitizer, 8 threads, locked store (must be clean)
        run: |
          set -euo pipefail
          g++ -std=c++17 -g -O1 -fsanitize=thread -pthread \
            -Isrc/Systems tests/consumable_cooldown_store.cpp -o /tmp/ccs_tsan
          TSAN_OPTIONS=halt_on_error=1 /tmp/ccs_tsan
      - name: ThreadSanitizer negative control, unlocked map (must report a race)
        run: |
          set -uo pipefail
          g++ -std=c++17 -g -O1 -fsanitize=thread -pthread -DNAXX_TSAN_NEGATIVE_CONTROL \
            -Isrc/Systems tests/consumable_cooldown_store.cpp -o /tmp/ccs_neg
          TSAN_OPTIONS=halt_on_error=1 /tmp/ccs_neg > /tmp/ccs_neg.txt 2>&1
          status=$?
          cat /tmp/ccs_neg.txt | head -n 30
          test "$status" -ne 0
          grep -q "WARNING: ThreadSanitizer: data race" /tmp/ccs_neg.txt
      - name: Scope of proof
        run: |
          echo 'Source contracts plus native and ThreadSanitizer tests of the cooldown store.'
          echo 'The pinned full Worldserver link runs in the existing GFPP / Hunter ammo / combined workflows.'
          echo 'No server launch, no 8-thread in-game run, no SQL, DBC, config or Playerbots change.'
