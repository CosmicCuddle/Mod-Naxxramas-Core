name: P13-R5 pinned core headless session identity boundary

on:
  push:
    branches:
      - 'test/cs01-p13-headless-session-identity-20261028'
  pull_request:
    paths:
      - 'tests/test_p13_headless_identity_source.py'
      - '.github/workflows/naxx-p13-headless-identity-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-headless-core-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable P13-R4 parent and two test-only paths
        shell: bash
        run: |
          set -euo pipefail
          BASE=11d8885ce5ef85d69543ab05d06dab9b6b0e95db
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD > /tmp/actual-changed
          printf '%s\n' \
            '.github/workflows/naxx-p13-headless-identity-source.yml' \
            'tests/test_p13_headless_identity_source.py' > /tmp/expected-changed
          diff -u /tmp/expected-changed /tmp/actual-changed
          for path in \
            src/Systems/HonorOverflow.cpp \
            conf/mod_naxxramas_core.conf.dist \
            tests/test_honoroverflow_masked_bot_source_witness.py \
            tests/test_p13_playerbots_reload_transition_source.py \
            tests/test_p13_playerbots_masked_destruction_source.py \
            tests/test_p13_playerbots_masked_bulk_logout_source.py \
            tests/test_p13_identity_helpers_config_mask_source.py; do
            test "$(git show "$BASE":"$path" | sha256sum | cut -d' ' -f1)" = \
                 "$(sha256sum "$path" | cut -d' ' -f1)"
          done
      - uses: actions/checkout@v4
        with:
          repository: Grimfeather/azerothcore-wotlk
          ref: 8daffdabe9202c228e45d833c9a1d399597a15cd
          path: pinned-core
          fetch-depth: 1
          sparse-checkout: |
            src/server/game/Server/WorldSession.h
            src/server/game/Server/WorldSession.cpp
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: d750b4b3a50effdf22bedc8032f0e8e5f7cb8091
          path: pinned-playerbots
          fetch-depth: 1
          sparse-checkout: |
            src/Bot/PlayerbotMgr.cpp
            src/Bot/PlayerbotAI.cpp
            src/Script/Playerbots.cpp
          sparse-checkout-cone-mode: false
      - name: Execute exact pinned core session and Playerbots source boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pinned-core rev-parse HEAD)" = \
               8daffdabe9202c228e45d833c9a1d399597a15cd
          test "$(git -C pinned-playerbots rev-parse HEAD)" = \
               d750b4b3a50effdf22bedc8032f0e8e5f7cb8091
          python3 -m py_compile tests/test_p13_headless_identity_source.py
          python3 tests/test_p13_headless_identity_source.py
