name: A02 S4 hunter pet autocast cache

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/a02-s4-hunter-pet-autocast-cache.yml'
      - 'src/Systems/HunterPetAutocastCache.cpp'
      - 'src/Systems/HunterPetAutocastCache.h'
      - 'src/NaxxramasCore_loader.cpp'
      - 'conf/mod_naxxramas_core.conf.dist'
      - 'docs/install/manual_hunter_pet_autocast_cache.sql'
      - 'tests/a02_s4_hunter_pet_autocast_cache_policy_tests.cpp'
      - 'tests/test_a02_s4_hunter_pet_autocast_cache.py'
      - 'docs/research/a02-s4-hunter-pet-autocast-cache.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naxx-a02-s4-hunter-pet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  policy-and-ip-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out this module commit
        uses: actions/checkout@v4
      - name: Install the policy-test compiler
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends g++
      - name: Compile the policy tests
        run: python3 -m unittest discover -s tests -p 'test_a02_s4_hunter_pet_autocast_cache.py' -v

  native-module-file:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: old-grimfeather
            core_sha: a66f1bede6f5d905d9ab815715b4e2ee1c1f48e7
          - name: prospective-new-grimfeather
            core_sha: 8daffdabe9202c228e45d833c9a1d399597a15cd
    name: Native TU / ${{ matrix.name }}
    steps:
      - name: Checkout pinned Grimfeather AzerothCore
        uses: actions/checkout@v4
        with:
          repository: Grimfeather/azerothcore-wotlk
          ref: ${{ matrix.core_sha }}
          path: acore
          persist-credentials: false
      - name: Checkout pinned Playerbots headers
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: 037c01418b5d01506917a3db9b44fd56ac5f965c
          path: acore/modules/mod-playerbots
          persist-credentials: false
      - name: Checkout pinned Individual Progression
        uses: actions/checkout@v4
        with:
          repository: Grimfeather/mod-individual-progression
          ref: 4ff4b5fcc1480348f058c632573143e62d4e3a41
          path: acore/modules/mod-individual-progression
          persist-credentials: false
      - name: Checkout this module commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: acore/modules/mod-naxxramas-core
          persist-credentials: false
      - name: Require the pinned SHAs and the disabled default
        run: |
          set -euo pipefail
          test "$(git -C acore rev-parse HEAD)" = "${{ matrix.core_sha }}"
          test "$(git -C acore/modules/mod-playerbots rev-parse HEAD)" = 037c01418b5d01506917a3db9b44fd56ac5f965c
          grep -Fqx 'bool IsRealPlayer(Player* player);' \
            acore/modules/mod-playerbots/src/Bot/PlayerbotAI.h
          test "$(git -C acore/modules/mod-individual-progression rev-parse HEAD)" = 4ff4b5fcc1480348f058c632573143e62d4e3a41
          test "$(git -C acore/modules/mod-naxxramas-core rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          grep -Fqx 'NaxxramasCore.HunterPet.AutocastCache.Enabled = 0' \
            acore/modules/mod-naxxramas-core/conf/mod_naxxramas_core.conf.dist
          grep -Fqx 'NaxxramasCore.HunterPet.AutocastCache.RestoreUtility = 0' \
            acore/modules/mod-naxxramas-core/conf/mod_naxxramas_core.conf.dist
          test -f acore/modules/mod-naxxramas-core/docs/install/manual_hunter_pet_autocast_cache.sql
          if grep -R -l -F --include='*.sql' 'mod_naxxramas_hunter_pet_autocast' \
            acore/modules/mod-naxxramas-core/data/sql; then
            echo "cache SQL must not live under data/sql"
            exit 1
          fi
      - name: Install the native compiler prerequisites
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git cmake ninja-build g++ make pkg-config file \
            libmysqlclient-dev libssl-dev libbz2-dev \
            libreadline-dev libncurses-dev libboost-all-dev
      - name: Configure the pinned core and the checked-out modules
        run: |
          cmake -S acore -B acore-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DMODULES=static -DSCRIPTS=static \
            -DAPPS_BUILD=world-only -DTOOLS_BUILD=none \
            -DUSE_COREPCH=ON -DUSE_SCRIPTPCH=ON
      - name: Compile the hunter pet autocast cache translation unit
        run: |
          python3 - <<'PY'
          import json
          import shlex
          import subprocess
          from pathlib import Path

          commands = json.loads(Path("acore-build/compile_commands.json").read_text(encoding="utf-8"))
          matched = [
              entry for entry in commands
              if entry["file"].endswith("/src/Systems/HunterPetAutocastCache.cpp")
          ]
          if len(matched) != 1:
              raise SystemExit(f"expected one hunter pet autocast cache TU, found {len(matched)}")
          entry = matched[0]
          raw = entry.get("arguments") or shlex.split(entry["command"])
          print("Compiling", entry["file"], flush=True)
          subprocess.run(raw, cwd=entry["directory"], timeout=360, check=True)
          print("PASS: HunterPetAutocastCache.cpp compiled against this pinned core")
          PY
      - name: State the compile boundary
        if: always()
        run: |
          echo "Translation unit only. This does not link worldserver or start it."
          echo "The characters SQL file was not applied."
          echo "In-game summon, relog, and rank change were not run."
