name: Golemagg action audit pinned full Worldserver link

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'src/Systems/BotGolemaggActionAudit.cpp'
      - 'src/NaxxramasCore_loader.cpp'
      - 'conf/mod_naxxramas_core.conf.dist'
      - 'scripts/check_golemagg_action_audit_pinned_compile.py'
      - 'tests/test_golemagg_action_audit.py'
      - '.github/workflows/golemagg-action-audit-pinned-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

# Keep completed exact-commit evidence. Do not interrupt an expensive job.
concurrency:
  group: golemagg-action-audit-compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  pinned-cpp-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout exact pinned Grimfeather core
        uses: actions/checkout@v4
        with:
          repository: Grimfeather/azerothcore-wotlk
          ref: a66f1bede6f5d905d9ab815715b4e2ee1c1f48e7
          path: acore
          persist-credentials: false
      - name: Checkout exact pinned Playerbots
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: 037c01418b5d01506917a3db9b44fd56ac5f965c
          path: acore/modules/mod-playerbots
          persist-credentials: false
      - name: Checkout exact pinned Individual Progression
        uses: actions/checkout@v4
        with:
          repository: Grimfeather/mod-individual-progression
          ref: 4ff4b5fcc1480348f058c632573143e62d4e3a41
          path: acore/modules/mod-individual-progression
          persist-credentials: false
      - name: Checkout exact draft Naxxramas Core head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: acore/modules/mod-naxxramas-core
          persist-credentials: false
      - name: Verify all source revisions
        run: |
          set -euo pipefail
          test "$(git -C acore rev-parse HEAD)" = "a66f1bede6f5d905d9ab815715b4e2ee1c1f48e7"
          test "$(git -C acore/modules/mod-playerbots rev-parse HEAD)" = "037c01418b5d01506917a3db9b44fd56ac5f965c"
          test "$(git -C acore/modules/mod-individual-progression rev-parse HEAD)" = "4ff4b5fcc1480348f058c632573143e62d4e3a41"
          test "$(git -C acore/modules/mod-naxxramas-core rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Run source safety tests
        run: python3 -m unittest discover -s acore/modules/mod-naxxramas-core/tests -p 'test_golemagg_action_audit.py' -v
      - name: Install C++ compile dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git cmake ninja-build g++ make pkg-config file \
            libmysqlclient-dev libssl-dev libbz2-dev \
            libreadline-dev libncurses-dev libboost-all-dev
      - name: Configure exact pinned module CMake
        run: |
          cmake -S acore -B acore-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DMODULES=static -DSCRIPTS=static \
            -DAPPS_BUILD=world-only -DTOOLS_BUILD=none \
            -DUSE_COREPCH=ON -DUSE_SCRIPTPCH=ON
      - name: Compile actual Golemagg diagnostic translation unit only
        run: |
          python3 acore/modules/mod-naxxramas-core/scripts/check_golemagg_action_audit_pinned_compile.py \
            --compile-commands acore-build/compile_commands.json --timeout 360
      - name: Link full pinned Worldserver without launching it
        run: cmake --build acore-build --target worldserver --parallel 2
      - name: Confirm linked Golemagg observer module registration
        run: |
          set -euo pipefail
          binary="$(find acore-build -type f -name worldserver -print -quit)"
          test -n "$binary"
          test -s "$binary"
          grep -aFq "NaxxramasCoreGolemaggActionAudit" "$binary"
          echo "PASS: read-only Golemagg observer registration found in full linked Worldserver."
      - name: State limits
        if: always()
        run: |
          echo "Pinned source tests + actual C++ unit compile + Worldserver link are build-only validation."
          echo "No server startup, owner installed-version verification, game test or tracer activation."
          echo "No action veto, no movement fix, no SQL or upstream code mutation."
