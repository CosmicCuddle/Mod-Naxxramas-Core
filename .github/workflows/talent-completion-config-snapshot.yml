name: "P7 BotTalentCompletion world-thread config snapshot (pinned TU + Worldserver link)"

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'src/Systems/BotTalentCompletion.cpp'
      - 'src/Systems/ConfigFlagSnapshot.h'
      - 'tests/config_flag_snapshot_tests.cpp'
      - 'tests/config_flag_snapshot_mutants.py'
      - 'tests/test_talent_completion_config_snapshot.py'
      - '.github/workflows/talent-completion-config-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: talent-completion-config-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  BASE_MAIN: 80e9de1c39a6dc995188a80c31a5e785d0f2a6f9
  CORE_SHA: 8daffdabe9202c228e45d833c9a1d399597a15cd
  PLAYERBOTS_SHA: d750b4b3a50effdf22bedc8032f0e8e5f7cb8091
  IP_SHA: dd96f2b77e3ebfa2a4726bf785525ba133f1ab61

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: "Child of main; only P7 paths change"
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_MAIN" HEAD
          allowed='src/Systems/BotTalentCompletion.cpp
          src/Systems/ConfigFlagSnapshot.h
          tests/config_flag_snapshot_tests.cpp
          tests/config_flag_snapshot_mutants.py
          tests/test_talent_completion_config_snapshot.py
          .github/workflows/talent-completion-config-snapshot.yml'
          git diff --name-only "$BASE_MAIN" HEAD | while read -r path; do
            printf '%s\n' "$allowed" | sed 's/^ *//' | grep -Fxq "$path" \
              || { echo "unexpected changed path: $path"; exit 1; }
          done
      - name: Source contracts (world-thread read, rest of file identical to main)
        run: |
          set -euo pipefail
          python3 -B -m unittest tests/test_talent_completion_config_snapshot.py -v 2>&1 | tee /tmp/c.txt
          grep -Eq '^Ran 5 tests in [0-9.]+s$' /tmp/c.txt
          grep -qx 'OK' /tmp/c.txt
      - name: Flag snapshot (C++17/20, ASan+UBSan, TSAN with 8 readers)
        run: |
          set -euo pipefail
          expected=$(grep -oP 'EXPECTED_CHECKS = \K[0-9]+' tests/config_flag_snapshot_tests.cpp)
          test "$expected" -ge 9
          F="-Wall -Wextra -Werror -pedantic -Wshadow -Wconversion -pthread -Isrc/Systems"
          for std in 17 20; do
            g++ -std=c++$std $F tests/config_flag_snapshot_tests.cpp -o /tmp/f$std
            /tmp/f$std | tee /tmp/f$std.txt
            grep -qx "PASS: config flag snapshot, $expected checks" /tmp/f$std.txt
          done
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all $F \
            tests/config_flag_snapshot_tests.cpp -o /tmp/asan
          /tmp/asan
          g++ -std=c++20 -O1 -g -fsanitize=thread $F tests/config_flag_snapshot_tests.cpp -o /tmp/tsan
          TSAN_OPTIONS=halt_on_error=1 /tmp/tsan
      - name: Must-fail mutants (3)
        run: |
          set -euo pipefail
          python3 -I tests/config_flag_snapshot_mutants.py /tmp/flagmut | tee /tmp/m.txt
          grep -qx '3/3 mutants caught' /tmp/m.txt

  pinned-tu-and-link:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Grimfeather/azerothcore-wotlk
          ref: ${{ env.CORE_SHA }}
          path: acore
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: ${{ env.PLAYERBOTS_SHA }}
          path: acore/modules/mod-playerbots
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Grimfeather/mod-individual-progression
          ref: ${{ env.IP_SHA }}
          path: acore/modules/mod-individual-progression
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: acore/modules/mod-naxxramas-core
          persist-credentials: false
      - name: Verify all source revisions
        run: |
          set -euo pipefail
          test "$(git -C acore rev-parse HEAD)" = "$CORE_SHA"
          test "$(git -C acore/modules/mod-playerbots rev-parse HEAD)" = "$PLAYERBOTS_SHA"
          test "$(git -C acore/modules/mod-individual-progression rev-parse HEAD)" = "$IP_SHA"
          test "$(git -C acore/modules/mod-naxxramas-core rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git cmake ninja-build g++ make pkg-config file binutils \
            libmysqlclient-dev libssl-dev libbz2-dev \
            libreadline-dev libncurses-dev libboost-all-dev
      - name: Configure
        run: |
          cmake -S acore -B acore-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DMODULES=static -DSCRIPTS=static \
            -DAPPS_BUILD=world-only -DTOOLS_BUILD=none \
            -DUSE_COREPCH=ON -DUSE_SCRIPTPCH=ON
      - name: Compile the real BotTalentCompletion TU
        run: |
          set -euo pipefail
          obj=modules/CMakeFiles/modules.dir/mod-naxxramas-core/src/Systems/BotTalentCompletion.cpp.o
          ninja -C acore-build "$obj"
          nm -C "acore-build/$obj" | tee /tmp/syms.txt
          grep -q 'NaxxramasCoreBotTalentCompletionConfig::OnAfterConfigLoad(bool)' /tmp/syms.txt
          grep -q 'T AddBotTalentCompletionScripts()' /tmp/syms.txt
      - name: Link full Worldserver without launching it
        run: cmake --build acore-build --target worldserver --parallel 2
      - name: Confirm the scripts in the linked binary
        run: |
          set -euo pipefail
          binary="$(find acore-build -type f -name worldserver -print -quit)"
          test -s "$binary"
          grep -aFq "NaxxramasCoreBotTalentCompletionConfig" "$binary"
          grep -aFq "NaxxramasCoreBotTalentCompletion" "$binary"
      - name: Scope of proof
        if: always()
        run: |
          echo 'Build-only. Same key and default; Enabled is now read on the world thread at config load.'
          echo 'No server start, gameplay test, SQL, DBC, config default, core, Playerbots or IP change.'
