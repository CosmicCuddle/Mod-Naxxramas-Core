name: "Part31 EP six previously skipped public-source cases (NO HOST)"
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/part31-ep-six-skips-pinned-source.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: part31-ep-six-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  six-source-cases-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact public Grimfeather core, sparse source only
        uses: actions/checkout@v4
        with:
          repository: Grimfeather/azerothcore-wotlk
          ref: 8daffdabe9202c228e45d833c9a1d399597a15cd
          path: acore
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/server/game/Entities/GameObject/GameObject.cpp
            src/server/game/Entities/Object/Object.cpp
            src/server/game/OutdoorPvP/OutdoorPvPMgr.cpp
            src/server/game/OutdoorPvP/OutdoorPvP.cpp
            src/server/game/World/World.cpp
            src/server/game/World/WorldState.cpp
            src/server/database/Database/DatabaseWorkerPool.cpp
            src/server/database/Updater/UpdateFetcher.cpp
            src/server/scripts/OutdoorPvP/OutdoorPvPEP.cpp
            src/server/scripts/OutdoorPvP/OutdoorPvPEP.h

      # EP's original test suite uses ROOT.parents[1] to locate AzerothCore.
      # A root checkout of the module leads it to skip even if acore/ exists.
      # Instead preserve the historical, intentional core/modules layout.
      - name: Checkout exact module child under core/modules (no installation)
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/Mod-Naxxramas-Core
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: acore/modules/mod-naxxramas-core
          persist-credentials: false

      - name: Verify both exact immutable source pins and all ten fixtures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C acore rev-parse HEAD)" = 8daffdabe9202c228e45d833c9a1d399597a15cd
          test "$(git -C acore/modules/mod-naxxramas-core rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          for path in             src/server/game/Entities/GameObject/GameObject.cpp             src/server/game/Entities/Object/Object.cpp             src/server/game/OutdoorPvP/OutdoorPvPMgr.cpp             src/server/game/OutdoorPvP/OutdoorPvP.cpp             src/server/game/World/World.cpp             src/server/game/World/WorldState.cpp             src/server/database/Database/DatabaseWorkerPool.cpp             src/server/database/Updater/UpdateFetcher.cpp             src/server/scripts/OutdoorPvP/OutdoorPvPEP.cpp             src/server/scripts/OutdoorPvP/OutdoorPvPEP.h; do
            test -s "acore/$path"
          done

      - name: Run exactly the six inherited EP tests, NONE skipped
        shell: bash
        working-directory: acore/modules/mod-naxxramas-core
        run: |
          set -euo pipefail
          python3 -I -B -W error tests/test_ep_tower_module_only.py \
            ModuleOnlySourceContract.test_pinned_northpass_spawn_callback_and_stock_faction \
            ModuleOnlySourceContract.test_pinned_outdoor_pvp_handler_is_selected_only_by_world_db \
            ModuleOnlySourceContract.test_pinned_real_core_late_loaded_spawn_metadata_contract \
            ModuleOnlySourceContract.test_pinned_real_core_restart_order_and_graceful_db_drain \
            ModuleOnlySourceContract.test_pinned_tower_timer_updates_without_nearby_players_or_loaded_grid \
            ModuleOnlySourceContract.test_pinned_updater_requires_manual_ep_sql_location \
            -v 2>&1 | tee /tmp/part31-ep-six.txt
          grep -Eq '^Ran 6 tests in [0-9.]+s$' /tmp/part31-ep-six.txt
          grep -qx 'OK' /tmp/part31-ep-six.txt
          ! grep -Eq '^FAILED|^ERROR:|^FAIL:|skipped|^OK \(skipped' /tmp/part31-ep-six.txt

      - name: Meaning of this proof (not an EP release)
        run: |
          echo "Public pinned core and module source assertions ONLY."
          echo "These six were SKIPPED in #189; this job proves only its exact six test executions."
          echo "No full Worldserver build, no realm, no SQL, no services, no installed EP behavior."
          echo "Do not infer EP source tests on an older/different pinned core passed."
