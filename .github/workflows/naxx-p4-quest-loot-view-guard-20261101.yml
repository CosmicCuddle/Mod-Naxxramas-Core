name: "P4 quest loot view guard (default OFF, NO HOST)"

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "src/Systems/QuestLootViewGuard.h"
      - "src/Systems/QuestLootViewGuard.cpp"
      - "src/NaxxramasCore_loader.cpp"
      - "conf/mod_naxxramas_core.conf.dist"
      - "tests/p4_view_guard/**"
      - "tests/test_p4_quest_loot_view_guard.py"
      - "docs/P4-QUEST-LOOT-VIEW-GUARD.md"
      - ".github/workflows/naxx-p4-quest-loot-view-guard-20261101.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p4-view-guard-${{ github.event.pull_request.number || github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

env:
  BASE_262: 49263795c3587658c315599dc759cb11059847ed
  CORE_PIN: 8daffdabe9202c228e45d833c9a1d399597a15cd

jobs:
  harness:
    name: "Pinned RED / guard GREEN (${{ matrix.cxx }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - name: "Checkout exact module head"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: module
          fetch-depth: 0
          persist-credentials: false
      - name: "Checkout pinned Grimfeather core (read-only sources and public SQL)"
        uses: actions/checkout@v4
        with:
          repository: Grimfeather/azerothcore-wotlk
          ref: ${{ env.CORE_PIN }}
          path: core
          persist-credentials: false
          sparse-checkout: |
            src/common
            src/server/shared
            src/server/game
            deps/fmt
            data/sql/base/db_world
      - name: "Exact heads, child of #262, exact change allowlist"
        working-directory: module
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git -C ../core rev-parse HEAD)" = "$CORE_PIN"
          git merge-base --is-ancestor "$BASE_262" HEAD
          python3 - <<'PY'
          import os, subprocess
          base = os.environ["BASE_262"]
          rows = subprocess.check_output(["git", "diff", "--name-status", base, "HEAD"], text=True).splitlines()
          actual = {tuple(r.split("\t")) for r in rows}
          allowed = {("A", p) for p in (
              "src/Systems/QuestLootViewGuard.h",
              "src/Systems/QuestLootViewGuard.cpp",
              "tests/p4_view_guard/guard_harness.cpp",
              "tests/p4_view_guard/build_guard.py",
              "tests/p4_view_guard/mutants.py",
              "tests/test_p4_quest_loot_view_guard.py",
              "docs/P4-QUEST-LOOT-VIEW-GUARD.md",
              ".github/workflows/naxx-p4-quest-loot-view-guard-20261101.yml",
          )} | {("M", "src/NaxxramasCore_loader.cpp"), ("M", "conf/mod_naxxramas_core.conf.dist")}
          assert actual == allowed, (actual ^ allowed)
          # The two existing files only gain lines, and only these.
          for path, want in (
              ("src/NaxxramasCore_loader.cpp",
               ["void AddQuestLootViewGuardScripts();", "    AddQuestLootViewGuardScripts();"]),
          ):
              diff = subprocess.check_output(["git", "diff", "-U0", base, "HEAD", "--", path], text=True).splitlines()
              assert not [l for l in diff if l.startswith("-") and not l.startswith("---")], path
              added = [l[1:] for l in diff if l.startswith("+") and not l.startswith("+++")]
              assert added == want, (path, added)
          diff = subprocess.check_output(["git", "diff", "-U0", base, "HEAD", "--", "conf/mod_naxxramas_core.conf.dist"], text=True).splitlines()
          assert not [l for l in diff if l.startswith("-") and not l.startswith("---")]
          added = [l[1:] for l in diff if l.startswith("+") and not l.startswith("+++")]
          settings = [l for l in added if l and not l.startswith("#")]
          assert settings == ["NaxxramasCore.QuestLootViewGuard.Enabled = 0"], settings
          print("PASS: exact change allowlist; loader +2 lines; conf adds one default-OFF key")
          PY
      - name: "Compiler"
        run: ${{ matrix.cxx }} --version
      - name: "Guard: 6 tests, 24 checks (pinned RED, guard GREEN), no skips"
        env:
          A04_CORE: ${{ github.workspace }}/core
          CXX: ${{ matrix.cxx }}
        run: |
          set -euo pipefail
          python3 -I -B -W error module/tests/test_p4_quest_loot_view_guard.py -v > /tmp/p4.txt 2>&1 || { cat /tmp/p4.txt; exit 1; }
          cat /tmp/p4.txt
          grep -Eq '^Ran 6 tests in [0-9.]+s$' /tmp/p4.txt
          grep -qx OK /tmp/p4.txt
          grep -qx 'CHECKS 24 passed, 0 failed' /tmp/p4.txt
          ! grep -Eq 'skipped|^FAILED|^ERROR:|^CHECK FAIL' /tmp/p4.txt
      - name: "Must-fail mutants of the real guard header (4)"
        env:
          A04_CORE: ${{ github.workspace }}/core
          CXX: ${{ matrix.cxx }}
        run: |
          set -euo pipefail
          python3 -I -B module/tests/p4_view_guard/mutants.py | tee /tmp/mutants.txt
          grep -qx '4/4 guard mutants caught' /tmp/mutants.txt
      - name: "Regression: unchanged #262 baseline harness (71 checks, 10 mutants)"
        env:
          A04_CORE: ${{ github.workspace }}/core
          CXX: ${{ matrix.cxx }}
        run: |
          set -euo pipefail
          python3 -I -B -W error module/tests/test_a04_native_quest_loot.py > /tmp/a04.txt 2>&1 || { cat /tmp/a04.txt; exit 1; }
          grep -qx 'CHECKS 71 passed, 0 failed' /tmp/a04.txt
          grep -qx OK /tmp/a04.txt
          python3 -I -B module/tests/a04_native/mutants.py | tee /tmp/a04m.txt
          grep -qx '10/10 mutants caught' /tmp/a04m.txt

  pinned-link:
    name: "Pinned full Worldserver link with the guard"
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: "Checkout exact owner Grimfeather AzerothCore"
        uses: actions/checkout@v4
        with:
          repository: Grimfeather/azerothcore-wotlk
          ref: 8daffdabe9202c228e45d833c9a1d399597a15cd
          path: acore
          persist-credentials: false
      - name: "Checkout compatible pinned Playerbots"
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: 037c01418b5d01506917a3db9b44fd56ac5f965c
          path: acore/modules/mod-playerbots
          persist-credentials: false
      - name: "Checkout pinned Grimfeather Individual Progression"
        uses: actions/checkout@v4
        with:
          repository: Grimfeather/mod-individual-progression
          ref: 4ff4b5fcc1480348f058c632573143e62d4e3a41
          path: acore/modules/mod-individual-progression
          persist-credentials: false
      - name: "Checkout exact Naxxramas Core head"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: acore/modules/mod-naxxramas-core
          persist-credentials: false
      - name: "Verify revisions and default-OFF settings"
        run: |
          set -euo pipefail
          test "$(git -C acore rev-parse HEAD)" = "8daffdabe9202c228e45d833c9a1d399597a15cd"
          test "$(git -C acore/modules/mod-playerbots rev-parse HEAD)" = "037c01418b5d01506917a3db9b44fd56ac5f965c"
          test "$(git -C acore/modules/mod-individual-progression rev-parse HEAD)" = "4ff4b5fcc1480348f058c632573143e62d4e3a41"
          conf=acore/modules/mod-naxxramas-core/conf/mod_naxxramas_core.conf.dist
          grep -Fqx 'NaxxramasCore.QuestLootViewGuard.Enabled = 0' "$conf"
          grep -Fqx 'NaxxramasCore.QuestLootProtection.Enabled = 0' "$conf"
          grep -Fq 'AddQuestLootViewGuardScripts();' acore/modules/mod-naxxramas-core/src/NaxxramasCore_loader.cpp
      - name: "Install build dependencies"
        run: |
          if [[ -f /etc/apt/sources.list ]]; then
            sudo sed -i '/packages\.microsoft\.com/d' /etc/apt/sources.list
          fi
          for list in /etc/apt/sources.list.d/*; do
            if [[ -f "$list" ]] && grep -q 'packages.microsoft.com' "$list"; then
              sudo rm -f "$list"
            fi
          done
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git cmake ninja-build g++ make pkg-config file \
            libmysqlclient-dev libssl-dev libbz2-dev \
            libreadline-dev libncurses-dev libboost-all-dev
      - name: "Configure full pinned scripts and module build"
        run: |
          cmake -S acore -B acore-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DMODULES=static -DSCRIPTS=static \
            -DAPPS_BUILD=world-only -DTOOLS_BUILD=none \
            -DUSE_COREPCH=ON -DUSE_SCRIPTPCH=ON
      - name: "Compile the real QuestLootViewGuard.cpp translation unit first"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, shlex, subprocess, sys
          entries = [e for e in json.load(open("acore-build/compile_commands.json"))
                     if e["file"].endswith("src/Systems/QuestLootViewGuard.cpp")]
          assert len(entries) == 1, len(entries)
          e = entries[0]
          cmd = e.get("arguments") or shlex.split(e["command"])
          print("compiling", e["file"])
          sys.exit(subprocess.run(cmd, cwd=e["directory"], timeout=900).returncode)
          PY
      - name: "Link Worldserver without launching it"
        run: cmake --build acore-build --target worldserver --parallel 2
      - name: "Confirm the guard is linked into Worldserver"
        run: |
          set -euo pipefail
          binary=acore-build/src/server/apps/worldserver
          archive=acore-build/modules/libmodules.a
          test -x "$binary" && test -s "$binary" && test -s "$archive"
          nm -C --defined-only "$binary" > /tmp/bin_syms
          nm -C --defined-only "$archive" > /tmp/ar_syms
          grep -Fq 'AddQuestLootViewGuardScripts()' /tmp/bin_syms
          grep -Fq 'AddQuestLootViewGuardScripts()' /tmp/ar_syms
          grep -Fq 'AddQuestLootProtectionScripts()' /tmp/bin_syms
          grep -aFq 'NaxxramasQuestLootViewGuardPlayer' "$binary"
          grep -aFq 'NaxxramasCore.QuestLootViewGuard.Enabled' "$binary"
          sha256sum "$binary"
          echo "PASS: guard compiled and linked; Worldserver not launched, no build output published."
      - name: "Scope of proof"
        if: always()
        run: |
          echo "Default OFF. Compile/link and the extracted-source harness are NOT in-game loot tests."
          echo "No owner server, database, SQL, config activation, merge or deployment."
