name: A04 human-friend observation gates (synthetic, review-only)

on:
  pull_request:
    paths:
      - 'tests/test_a04_human_friend_observation_s1.py'
      - 'tests/test_a04_stock_visibility_award_s1.py'
      - 'tests/test_a04_item_award_triage_s1.py'
      - 'tests/test_a04_module_hook_inventory_s1.py'
      - 'tests/test_a04_personal_ffa_slot_s1.py'
      - 'tests/test_a04_sql_preflight_contract_s1.py'
      - 'tests/test_a04_sql_source_mapping_s1.py'
      - 'docs/research/A04-HUMAN-FRIEND-OBSERVATION-GATES-S1.md'
      - 'docs/research/A04-NATIVE-VISIBILITY-VS-AWARD-SOURCE-TRACE.md'
      - 'docs/research/A04-PER-VIEWER-FFA-AND-PLAYERBOT-PACKET-SOURCE-TRACE.md'
      - 'docs/research/A04-READ-ONLY-ITEM-LOOT-PREFLIGHT.md'
      - 'docs/research/A04-ITEM-AWARD-TRIAGE-S1.md'
      - 'docs/research/A04-MODULE-HOOK-INVENTORY-S1.md'
      - 'docs/research/A04-HUMAN-TO-HUMAN-S2-FUNCTIONAL-GATE.md'
      - 'src/Systems/QuestLootProtection.cpp'
      - '.github/workflows/a04-human-friend-observation-s1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observation-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact pull request source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - name: Synthetic human friend source/decision checks only
        run: python3 -m unittest discover -s tests -p 'test_a04_human_friend_observation_s1.py' -v
      - name: Synthetic stock visibility and award-path comparison (not gameplay)
        run: python3 -m unittest discover -s tests -p 'test_a04_stock_visibility_award_s1.py' -v
      - name: Synthetic quest-item award evidence triage (not gameplay)
        run: python3 -m unittest discover -s tests -p 'test_a04_item_award_triage_s1.py' -v
      - name: Static module hook inventory (not full server or gameplay)
        run: python3 -m unittest discover -s tests -p 'test_a04_module_hook_inventory_s1.py' -v
      - name: Synthetic personal FFA per-viewer membership (not gameplay)
        run: python3 -m unittest discover -s tests -p 'test_a04_personal_ffa_slot_s1.py' -v
      - name: Static SELECT-only public item/loot schema preflight
        run: python3 -m unittest discover -s tests -p 'test_a04_sql_preflight_contract_s1.py' -v
      - name: Synthetic in-memory SQLite direct/reference source witnesses
        run: python3 -m unittest discover -s tests -p 'test_a04_sql_source_mapping_s1.py' -v
      - name: No live testing, external database access or uploaded artifact
        run: |
          test -f tests/test_a04_human_friend_observation_s1.py
          test -f tests/test_a04_stock_visibility_award_s1.py
          test -f tests/test_a04_item_award_triage_s1.py
          test -f tests/test_a04_module_hook_inventory_s1.py
          test -f tests/test_a04_personal_ffa_slot_s1.py
          test -f tests/test_a04_sql_preflight_contract_s1.py
          test -f tests/test_a04_sql_source_mapping_s1.py
          echo 'Synthetic SQLite memory only. No owner character, loot, external database, server or upload action.'
