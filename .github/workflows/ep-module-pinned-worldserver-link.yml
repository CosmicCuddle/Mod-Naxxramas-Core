name: EP module-only pinned Worldserver full link
on:
  pull_request:
    # Push validates every relevant commit on the feature branch; avoid
    # duplicate expensive runs on every pull_request.synchronize event.
    # Still run when an eligible PR is first opened or reopened.
    types: [opened, reopened]
    paths:
      - 'src/Systems/EasternPlaguelandsTowerLock.cpp'
      - 'src/NaxxramasCore_loader.cpp'
      - 'docs/install/2026_10_13_00_ep_tower_lock_module_bind.sql'
      - '.github/workflows/ep-module-pinned-worldserver-link.yml'
  push:
    branches: [feature/ep-tower-lock-module-only]
    paths:
      - 'src/Systems/EasternPlaguelandsTowerLock.cpp'
      - 'src/NaxxramasCore_loader.cpp'
      - 'docs/install/2026_10_13_00_ep_tower_lock_module_bind.sql'
      - '.github/workflows/ep-module-pinned-worldserver-link.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linked-worldserver:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - name: Checkout pinned Playerbots-compatible AzerothCore
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/azerothcore-wotlk
          ref: b7f06a16ac7120b5abc2e8d3f96a94265a363224
          path: acore
          persist-credentials: false
      - name: Checkout pinned Playerbots module
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: 037c01418b5d01506917a3db9b44fd56ac5f965c
          path: acore/modules/mod-playerbots
          persist-credentials: false
      - name: Checkout pinned Individual Progression module
        uses: actions/checkout@v4
        with:
          repository: ZhengPeiRu21/mod-individual-progression
          ref: 283abe12774801e5671da746ea8bf535cc0252e0
          path: acore/modules/mod-individual-progression
          persist-credentials: false
      - name: Checkout exact Naxxramas module commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: acore/modules/mod-naxxramas-core
          persist-credentials: false
      - name: Confirm source SHAs before build
        run: |
          set -euo pipefail
          test "$(git -C acore rev-parse HEAD)" = "b7f06a16ac7120b5abc2e8d3f96a94265a363224"
          test "$(git -C acore/modules/mod-playerbots rev-parse HEAD)" = "037c01418b5d01506917a3db9b44fd56ac5f965c"
          test "$(git -C acore/modules/mod-individual-progression rev-parse HEAD)" = "283abe12774801e5671da746ea8bf535cc0252e0"
          test "$(git -C acore/modules/mod-naxxramas-core rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Run exact-commit EP regression tests and confirm manual-only SQL
        run: |
          set -euo pipefail
          module=acore/modules/mod-naxxramas-core
          test -f "$module/docs/install/2026_10_13_00_ep_tower_lock_module_bind.sql"
          test ! -e "$module/data/sql/db-world/2026_10_13_00_ep_tower_lock_module_bind.sql"
          python3 -m unittest discover -s "$module/tests" -p 'test_ep_tower_module_only.py' -v
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git cmake ninja-build g++ make pkg-config file \
            libmysqlclient-dev libssl-dev libbz2-dev \
            libreadline-dev libncurses-dev libboost-all-dev
      - name: Configure full static scripts and module build
        run: |
          cmake -S acore -B acore-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DMODULES=static -DSCRIPTS=static \
            -DAPPS_BUILD=world-only -DTOOLS_BUILD=none \
            -DUSE_COREPCH=ON -DUSE_SCRIPTPCH=ON
      - name: Build and LINK Worldserver (never start it)
        run: cmake --build acore-build --target worldserver --parallel 2
      - name: Confirm unique handler exists in linked binary
        run: |
          set -euo pipefail
          binary="$(find acore-build -type f -name worldserver -print -quit)"
          test -n "$binary"
          test -s "$binary"
          test -x "$binary"
          grep -aFq "outdoorpvp_naxxramas_ep_lock" "$binary"
          file "$binary"
          echo "Linked Worldserver SHA-256:"
          sha256sum "$binary"
          echo "Exact module source commit:"
          git -C acore/modules/mod-naxxramas-core rev-parse HEAD
          echo "PASS: module's unique Eastern Plaguelands handler was included in linked Worldserver."
          echo "No DB migration, server startup, timed gameplay, or production changes."
