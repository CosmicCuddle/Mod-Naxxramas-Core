name: "B09 Elemental Invasions calendar tests (real source, pinned link)"

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'src/Events/ElementalInvasionCalendar.cpp'
      - 'tests/elemental_invasion_calendar_tests.cpp'
      - 'tests/b09_stubs/**'
      - 'docs/research/B09-ELEMENTAL-INVASION-CALENDAR-TESTS.md'
      - '.github/workflows/elemental-invasion-calendar-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b09-calendar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  BASE_MAIN: 80e9de1c39a6dc995188a80c31a5e785d0f2a6f9
  CORE_SHA: 8daffdabe9202c228e45d833c9a1d399597a15cd
  PLAYERBOTS_SHA: d750b4b3a50effdf22bedc8032f0e8e5f7cb8091
  IP_SHA: dd96f2b77e3ebfa2a4726bf785525ba133f1ab61

jobs:
  calendar-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: "Child of main; only B09 paths differ; no SQL or config change"
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_MAIN" HEAD
          git diff --name-only "$BASE_MAIN" HEAD | while read -r path; do
            case "$path" in
              src/Events/ElementalInvasionCalendar.cpp|tests/elemental_invasion_calendar_tests.cpp|\
              tests/b09_stubs/*.h|docs/research/B09-ELEMENTAL-INVASION-CALENDAR-TESTS.md|\
              .github/workflows/elemental-invasion-calendar-tests.yml) ;;
              *) echo "unexpected changed path: $path"; exit 1 ;;
            esac
          done
          git diff --quiet "$BASE_MAIN" HEAD -- conf data sql
      - name: tzdata present (DST cases must not degrade to UTC)
        run: test -f /usr/share/zoneinfo/Australia/Lord_Howe && test -f /usr/share/zoneinfo/America/Asuncion
      - name: Real calendar source, C++17/20 strict and ASan+UBSan
        run: |
          set -euo pipefail
          for std in 17 20; do
            g++ -std=c++$std -Wall -Wextra -Werror -Itests/b09_stubs -Isrc/Events \
              tests/elemental_invasion_calendar_tests.cpp -Wl,--wrap=time -o /tmp/b09_$std
            /tmp/b09_$std | tee /tmp/b09_$std.txt
            grep -qx 'PASS: Elemental Invasions calendar, 267904 checks' /tmp/b09_$std.txt
          done
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Itests/b09_stubs -Isrc/Events tests/elemental_invasion_calendar_tests.cpp \
            -Wl,--wrap=time -o /tmp/b09_asan
          /tmp/b09_asan
      - name: Same tests are red on the unfixed main source (exactly the latch checks)
        run: |
          set -euo pipefail
          mkdir -p /tmp/mainsrc
          git show "$BASE_MAIN:src/Events/ElementalInvasionCalendar.cpp" > /tmp/mainsrc/ElementalInvasionCalendar.cpp
          g++ -std=c++17 -Itests/b09_stubs -I/tmp/mainsrc tests/elemental_invasion_calendar_tests.cpp \
            -Wl,--wrap=time -o /tmp/b09_main
          if /tmp/b09_main > /tmp/b09_main.txt; then
            echo "expected the unfixed source to fail"; exit 1
          fi
          cat /tmp/b09_main.txt
          grep -qx 'FAILED: 3 of 267904 checks' /tmp/b09_main.txt
          test "$(grep -c '^FAIL ' /tmp/b09_main.txt)" = 3
          ! grep '^FAIL ' /tmp/b09_main.txt | grep -v 'CountLog("ERROR"'

  pinned-worldserver-link:
    needs: calendar-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Grimfeather/azerothcore-wotlk
          ref: ${{ env.CORE_SHA }}
          path: acore
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: ${{ env.PLAYERBOTS_SHA }}
          path: acore/modules/mod-playerbots
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Grimfeather/mod-individual-progression
          ref: ${{ env.IP_SHA }}
          path: acore/modules/mod-individual-progression
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: acore/modules/mod-naxxramas-core
          persist-credentials: false
      - name: Verify all source revisions
        run: |
          set -euo pipefail
          test "$(git -C acore rev-parse HEAD)" = "$CORE_SHA"
          test "$(git -C acore/modules/mod-playerbots rev-parse HEAD)" = "$PLAYERBOTS_SHA"
          test "$(git -C acore/modules/mod-individual-progression rev-parse HEAD)" = "$IP_SHA"
          test "$(git -C acore/modules/mod-naxxramas-core rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git cmake ninja-build g++ make pkg-config file \
            libmysqlclient-dev libssl-dev libbz2-dev \
            libreadline-dev libncurses-dev libboost-all-dev
      - name: Configure
        run: |
          cmake -S acore -B acore-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DMODULES=static -DSCRIPTS=static \
            -DAPPS_BUILD=world-only -DTOOLS_BUILD=none \
            -DUSE_COREPCH=ON -DUSE_SCRIPTPCH=ON
      - name: Link full Worldserver without launching it
        run: cmake --build acore-build --target worldserver --parallel 2
      - name: Confirm calendar script in the linked binary
        run: |
          set -euo pipefail
          binary="$(find acore-build -type f -name worldserver -print -quit)"
          test -s "$binary"
          grep -aFq "NaxxramasCoreElementalInvasionCalendar" "$binary"
      - name: Scope of proof
        if: always()
        run: |
          echo 'Build-only for the real source. Calendar stays default OFF (Enabled = 0).'
          echo 'No server start, gameplay test, SQL, DBC, config, core, Playerbots or IP change.'
