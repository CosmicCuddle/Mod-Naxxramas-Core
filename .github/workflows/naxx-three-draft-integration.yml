name: Naxx Core three-draft combined integration (pinned Worldserver)

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'src/**'
      - 'conf/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/naxx-three-draft-integration.yml'
      - '.github/workflows/hunter-ammo-pinned-worldserver.yml'
      - '.github/workflows/hunter-autocast-audit-pinned.yml'
      - '.github/workflows/golemagg-action-audit-pinned-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naxx-three-draft-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  combined-source-and-full-link:
    # This diagnostic is only for source integration PRs, not any feature PR.
    if: ${{ startsWith(github.head_ref, 'integration/') || (github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'integration/')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout exact pinned Grimfeather AzerothCore
        uses: actions/checkout@v4
        with:
          repository: Grimfeather/azerothcore-wotlk
          ref: a66f1bede6f5d905d9ab815715b4e2ee1c1f48e7
          path: acore
          persist-credentials: false
      - name: Checkout exact pinned Playerbots
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: 037c01418b5d01506917a3db9b44fd56ac5f965c
          path: acore/modules/mod-playerbots
          persist-credentials: false
      - name: Checkout exact pinned Individual Progression
        uses: actions/checkout@v4
        with:
          repository: Grimfeather/mod-individual-progression
          ref: 4ff4b5fcc1480348f058c632573143e62d4e3a41
          path: acore/modules/mod-individual-progression
          persist-credentials: false
      - name: Checkout exact combined integration branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: acore/modules/mod-naxxramas-core
          persist-credentials: false
      - name: Verify pinned dependency revisions and exact candidate SHA
        run: |
          set -euo pipefail
          test "$(git -C acore rev-parse HEAD)" = "a66f1bede6f5d905d9ab815715b4e2ee1c1f48e7"
          test "$(git -C acore/modules/mod-playerbots rev-parse HEAD)" = "037c01418b5d01506917a3db9b44fd56ac5f965c"
          test "$(git -C acore/modules/mod-individual-progression rev-parse HEAD)" = "4ff4b5fcc1480348f058c632573143e62d4e3a41"
          test "$(git -C acore/modules/mod-naxxramas-core rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Validate merged default-off configuration and BOTH registrations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base = Path("acore/modules/mod-naxxramas-core")
          cfg = (base/"conf/mod_naxxramas_core.conf.dist").read_text()
          loader = (base/"src/NaxxramasCore_loader.cpp").read_text()
          expected = (
              'NaxxramasCore.Playerbots.GolemaggActionAudit.Enabled = 0',
              'NaxxramasCore.Playerbots.GolemaggActionAudit.AllowedBotName = ""',
              'NaxxramasCore.BotConsumables.HunterAmmo.Enabled = 0',
              'NaxxramasCore.BotConsumables.HunterAmmo.AllowSelectedNonVendor = 0',
              'NaxxramasCore.HunterPetAutocast.AuditEnabled = 0',
          )
          for item in expected:
              assert cfg.count(item) == 1, f"Missing/duplicate config: {item}"
          for fn in ("AddBotGolemaggActionAuditScripts", "AddHunterPetAutocastAuditScripts"):
              assert loader.count(f"void {fn}();") == 1, f"Missing/duplicate declaration {fn}"
              assert loader.count(f"    {fn}();") == 1, f"Missing/duplicate registration {fn}"
          print("PASS: all three OFF defaults and both observer registrations coexist.")
          PY
      - name: Run all three source contract families
        run: |
          set -euo pipefail
          root="acore/modules/mod-naxxramas-core/tests"
          python3 -m unittest discover -s "$root" -p 'test_golemagg_action_audit.py' -v
          python3 -m unittest discover -s "$root" -p 'test_hunter_ammo_consumables.py' -v
          python3 -m unittest discover -s "$root" -p 'test_hunter_pet_autocast*.py' -v
      - name: Validate pinned IP/Playerbots native Hunter pet producer boundary
        run: |
          set -euo pipefail
          python3 acore/modules/mod-naxxramas-core/scripts/check_hunter_pet_native_producer_boundary_pinned.py \
            --ip acore/modules/mod-individual-progression \
            --playerbots acore/modules/mod-playerbots
      - name: Validate human-player Hunter native autocast storage and IP rank replacement
        run: |
          set -euo pipefail
          python3 acore/modules/mod-naxxramas-core/scripts/check_hunter_pet_human_autocast_boundary_pinned.py \
            --core acore --ip acore/modules/mod-individual-progression
      - name: Run standalone Golemagg, Hunter ammo and Hunter pet safety C++ tests
        run: |
          set -euo pipefail
          base="acore/modules/mod-naxxramas-core"
          for spec in \
            "golemagg_action_audit_allowlist.cpp" \
            "hunter_ammo_selection.cpp" \
            "hunter_pet_autocast_decision_gate.cpp" \
            "hunter_pet_autocast_handoff_contract.cpp" \
            "hunter_pet_autocast_bot_precedence.cpp" \
            "hunter_pet_autocast_playerbot_bridge.cpp"; do
            g++ -std=c++20 -Wall -Wextra -Werror -pedantic \
              -I"$base/src/Systems" "$base/tests/$spec" -o /tmp/naxx_integration_model_test
            /tmp/naxx_integration_model_test
          done
      - name: Install complete Worldserver compile dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git cmake ninja-build g++ make pkg-config file \
            libmysqlclient-dev libssl-dev libbz2-dev \
            libreadline-dev libncurses-dev libboost-all-dev
      - name: Configure pinned combined static modules and script build
        run: |
          cmake -S acore -B acore-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DMODULES=static -DSCRIPTS=static \
            -DAPPS_BUILD=world-only -DTOOLS_BUILD=none \
            -DUSE_COREPCH=ON -DUSE_SCRIPTPCH=ON
      - name: Compile all three actual module C++ translation units
        run: |
          set -euo pipefail
          base="acore/modules/mod-naxxramas-core/scripts"
          python3 "$base/check_golemagg_action_audit_pinned_compile.py" --compile-commands acore-build/compile_commands.json --timeout 360
          python3 "$base/check_hunter_ammo_pinned_compile.py" --compile-commands acore-build/compile_commands.json --timeout 360
          python3 "$base/check_hunter_pet_autocast_pinned_compile.py" --compile-commands acore-build/compile_commands.json --timeout 360
      - name: Link ONE full Worldserver with all three module drafts
        run: cmake --build acore-build --target worldserver --parallel 2
      - name: Verify three features retained in final combined Worldserver
        run: |
          set -euo pipefail
          binary="acore-build/src/server/apps/worldserver"
          archive="acore-build/modules/libmodules.a"
          test -s "$binary" && test -x "$binary" && test -s "$archive"
          nm -C --defined-only "$archive" > /tmp/naxx_integration_archive_symbols.txt
          nm -C --defined-only "$binary" > /tmp/naxx_integration_binary_symbols.txt
          symbol='NaxxramasHunterAmmo::TopUpHunterAmmo('
          grep -Fq "$symbol" /tmp/naxx_integration_archive_symbols.txt
          grep -Fq "$symbol" /tmp/naxx_integration_binary_symbols.txt
          grep -aFq 'NaxxramasCoreGolemaggActionAudit' "$binary"
          grep -aFq 'NaxxramasHunterPetAutocastPacketObserver' "$binary"
          echo "PASS: Hunter ammo function and both diagnostic registrations linked in SAME Worldserver."
      - name: State strict acceptance boundary
        if: always()
        run: |
          echo "Combined source/build test only. No Worldserver was started."
          echo "No merge, install, config enablement, DB/DBC change, item grant or Golemagg/Hunter in-game test."
          echo "The Hunter pet autocast observer is NOT functional preference persistence."
