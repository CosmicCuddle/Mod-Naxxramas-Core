name: P1 Warlock second-stage default-OFF pilot native build
on:
  push:
    branches: ['test/cs01-p1-warlock-second-stage-pilot-20261030']
    paths:
      - src/Systems/MeetingStoneProgression.cpp
      - conf/mod_naxxramas_core.conf.dist
      - tests/test_meeting_stone_ritual_isolation.py
      - tests/test_p1_warlock_second_stage_pilot.py
      - docs/testing/P1-WARLOCK-SECOND-STAGE-PILOT.md
      - .github/workflows/naxx-p1-warlock-second-stage-pilot.yml
  workflow_dispatch:
permissions:
  contents: read
env:
  MOD_BASE: 80e9de1c39a6dc995188a80c31a5e785d0f2a6f9
  CORE_SHA: b7f06a16ac7120b5abc2e8d3f96a94265a363224
  BOTS_SHA: 037c01418b5d01506917a3db9b44fd56ac5f965c
  IP_SHA: 283abe12774801e5671da746ea8bf535cc0252e0
jobs:
  source-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Strict only six isolated source/config/test/docs/CI paths
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$MOD_BASE" HEAD
          python3 - <<'PY'
          import subprocess
          changes=[row.split('\t',1) for row in subprocess.check_output(
              ["git","diff","--name-status","80e9de1c39a6dc995188a80c31a5e785d0f2a6f9","HEAD"],
              text=True).splitlines()]
          expected={
            "src/Systems/MeetingStoneProgression.cpp":"M",
            "conf/mod_naxxramas_core.conf.dist":"M",
            "tests/test_meeting_stone_ritual_isolation.py":"M",
            "tests/test_p1_warlock_second_stage_pilot.py":"A",
            "docs/testing/P1-WARLOCK-SECOND-STAGE-PILOT.md":"A",
            ".github/workflows/naxx-p1-warlock-second-stage-pilot.yml":"A"
          }
          assert len(changes)==6 and {p:k for k,p in changes}==expected,changes
          print("PASS: P1 exactly six approved source/config/test/docs/CI paths")
          PY
          grep -Fxq 'NaxxramasCore.WarlockRitual.SecondStagePilot.Enabled = 0' conf/mod_naxxramas_core.conf.dist
          grep -Fxq 'NaxxramasCore.MeetingStones.ClassicMode.Enabled = 1' conf/mod_naxxramas_core.conf.dist
          test "$(git rev-parse "$MOD_BASE":src/Systems/MeetingStoneProgression.cpp)" = b46d0f2b5c16e490878e68d259092ebb4b2fdc7a
      - name: Original Vanilla guard, new pilot and QuestLoot no-upload safety tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_meeting_stone_ritual_isolation.py -v
          python3 -m unittest discover -s tests -p test_p1_warlock_second_stage_pilot.py -v
          python3 -m unittest discover -s tests -p test_quest_loot_protection.py -v
          echo 'PASS: P1 guarded source-only tests, not gameplay'
  real-worldserver:
    needs: source-guards
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mod-playerbots/azerothcore-wotlk
          ref: b7f06a16ac7120b5abc2e8d3f96a94265a363224
          path: acore
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: 037c01418b5d01506917a3db9b44fd56ac5f965c
          path: acore/modules/mod-playerbots
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ZhengPeiRu21/mod-individual-progression
          ref: 283abe12774801e5671da746ea8bf535cc0252e0
          path: acore/modules/mod-individual-progression
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: acore/modules/mod-naxxramas-core
          persist-credentials: false
      - name: Verify exact original historical source pins
        run: |
          set -euo pipefail
          test "$(git -C acore rev-parse HEAD)" = "$CORE_SHA"
          test "$(git -C acore/modules/mod-playerbots rev-parse HEAD)" = "$BOTS_SHA"
          test "$(git -C acore/modules/mod-individual-progression rev-parse HEAD)" = "$IP_SHA"
          test "$(git -C acore/modules/mod-naxxramas-core rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C acore rev-parse HEAD:src/server/game/Entities/GameObject/GameObject.cpp)" = c006c59145b3bdd14e7d3f513628bc0a29653835
          grep -Fq 'spellId = 23598;' acore/src/server/game/Entities/GameObject/GameObject.cpp
      - name: Install runner-only C++ build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git cmake ninja-build g++ make pkg-config file \
            libmysqlclient-dev libssl-dev libbz2-dev \
            libreadline-dev libncurses-dev libboost-all-dev
      - name: Configure actual source and full Worldserver target
        run: |
          cmake -S acore -B acore-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DMODULES=static -DSCRIPTS=static \
            -DAPPS_BUILD=world-only -DTOOLS_BUILD=none \
            -DUSE_COREPCH=ON -DUSE_SCRIPTPCH=ON
      - name: Compile REAL modified MeetingStoneProgression translation unit
        run: |
          python3 - <<'PY'
          import json,shlex,subprocess
          from pathlib import Path
          commands=json.loads(Path("acore-build/compile_commands.json").read_text())
          want="mod-naxxramas-core/src/Systems/MeetingStoneProgression.cpp"
          records=[x for x in commands if x.get("file","").replace("\\","/").endswith(want)]
          assert len(records)==1,(want,len(records))
          item=records[0]
          args=item.get("arguments") or shlex.split(item["command"])
          assert any("MeetingStoneProgression.cpp" in x for x in args)
          subprocess.run(args,cwd=item["directory"],check=True,timeout=450)
          print("PASS: P1 actual modified C++ TU compiled against pinned dependencies",flush=True)
          PY
      - name: Diagnose compiled P1 object before linking (no gameplay or config change)
        run: |
          set -euo pipefail
          obj=acore-build/modules/CMakeFiles/modules.dir/mod-naxxramas-core/src/Systems/MeetingStoneProgression.cpp.o
          test -s "$obj" || { echo 'FAIL: compiled P1 translation unit object missing' >&2; exit 1; }
          echo 'PASS: compiled P1 translation unit object exists'
          for key in 'NaxxramasCore.MeetingStones.ClassicMode.Enabled' 'NaxxramasCore.WarlockRitual.SecondStagePilot.Enabled'; do
            if grep -aFq "$key" "$obj"; then
              echo "PRESENT in prelink P1 object: $key"
            else
              echo "MISSING from prelink P1 object: $key (diagnostic, not independently a gameplay failure)"
            fi
          done
      - name: Compile and link complete Worldserver without launching it
        run: cmake --build acore-build --target worldserver --parallel 2
      - name: Verify real linked module and Meeting Stone virtual gameplay hook
        run: |
          set -euo pipefail
          binary=acore-build/src/server/apps/worldserver
          archive=acore-build/modules/libmodules.a
          test -x "$binary" && test -s "$archive"
          # Materialize symbol listings first: nm | grep -q under pipefail
          # can fail with SIGPIPE even after grep found a valid match.
          nm -C --defined-only "$archive" > "$RUNNER_TEMP/naxx-p1-archive-symbols.txt"
          nm -C --defined-only "$binary" > "$RUNNER_TEMP/naxx-p1-worldserver-symbols.txt"
          if grep -Fq 'AddMeetingStoneProgressionScripts()' "$RUNNER_TEMP/naxx-p1-archive-symbols.txt"; then
            echo 'PASS: P1 loader symbol defined in module archive'
          else
            echo 'FAIL: P1 loader symbol missing from module archive' >&2
            exit 1
          fi
          if grep -Fq 'AddMeetingStoneProgressionScripts()' "$RUNNER_TEMP/naxx-p1-worldserver-symbols.txt"; then
            echo 'PASS: P1 loader symbol defined in linked Worldserver'
          else
            echo 'FAIL: P1 loader symbol missing from linked Worldserver' >&2
            exit 1
          fi
          # Compare the old Vanilla stone gate and new pilot gate at archive
          # and final-link stages. Missing key in a binary is a diagnostic,
          # not proof that the gameplay hook ran or that config was loaded.
          for key in 'NaxxramasCore.MeetingStones.ClassicMode.Enabled' 'NaxxramasCore.WarlockRitual.SecondStagePilot.Enabled'; do
            for stage in "$archive" "$binary"; do
              if grep -aFq "$key" "$stage"; then
                echo "PRESENT $key in $stage"
              else
                echo "MISSING $key from $stage"
              fi
            done
          done
          # Release/O3 may construct a std::string literal from optimized
          # fragments. No contiguous key bytes is NOT proof a config read
          # was compiled out (both old Vanilla and P1 keys lack such bytes
          # even in this run's compiled object; source-guards validate the
          # exact configuration key and fail-closed default separately).
          # Hard-gate the actual virtual GO handler and its vtable on BOTH
          # module archive and final executable; never just a loader stub.
          for symbols in "$RUNNER_TEMP/naxx-p1-archive-symbols.txt" "$RUNNER_TEMP/naxx-p1-worldserver-symbols.txt"; do
            if grep -Fq 'NaxxramasCoreMeetingStoneProgression::CanGameObjectGossipHello(' "$symbols"; then
              echo "PASS: actual P1-capable virtual GO handler defined in $symbols"
            else
              echo "FAIL: P1-capable virtual GO handler missing from $symbols" >&2
              exit 1
            fi
            if grep -Fq 'vtable for NaxxramasCoreMeetingStoneProgression' "$symbols"; then
              echo "PASS: Meeting Stone hook dispatch vtable defined in $symbols"
            else
              echo "FAIL: Meeting Stone hook dispatch vtable missing from $symbols" >&2
              exit 1
            fi
          done
          sha256sum "$binary"
          echo 'PASS: actual Meeting Stone hook linked in real historical-compatible Worldserver; source default-OFF contract passed'
      - name: Release/owner-host nonauthorization
        if: always()
        run: |
          echo 'No artifact upload, Worldserver start, install, deploy, SQL/DBC or live game testing.'
          echo 'P1 remains FAILED until group+target/cooldown/GO provenance tests on owner-approved backed-up realm.'
          echo 'R7 release HOLD; MapUpdate.Threads=8; F14 OFF; NoWrite relay OFF; D18 HARD NO-GO.'

  owner-source-worldserver:
    name: Owner-reported source pins and two preserved Playerbots local edits
    needs: source-guards
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout owner's reported AzerothCore core SHA
        uses: actions/checkout@v4
        with:
          repository: Grimfeather/azerothcore-wotlk
          ref: 8daffdabe9202c228e45d833c9a1d399597a15cd
          path: acore
          persist-credentials: false

      - name: Checkout owner's reported Playerbots SHA
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: e88cc4099e69f35126b28942a412ca702d20453b
          path: acore/modules/mod-playerbots
          persist-credentials: false

      - name: Checkout owner's clean Cosmic IP fork source baseline
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/mod-individual-progression
          ref: dd96f2b77e3ebfa2a4726bf785525ba133f1ab61
          path: acore/modules/mod-individual-progression
          persist-credentials: false

      - name: Checkout exact unmerged Warlock P1 pilot DRAFT commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: acore/modules/mod-naxxramas-core
          persist-credentials: false

      - name: Verify exact four source SHA pins and Warlock source gates
        run: |
          set -euo pipefail
          test "$(git -C acore rev-parse HEAD)" = 8daffdabe9202c228e45d833c9a1d399597a15cd
          test "$(git -C acore/modules/mod-playerbots rev-parse HEAD)" = e88cc4099e69f35126b28942a412ca702d20453b
          test "$(git -C acore/modules/mod-individual-progression rev-parse HEAD)" = dd96f2b77e3ebfa2a4726bf785525ba133f1ab61
          test "$(git -C acore/modules/mod-naxxramas-core rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fxq 'NaxxramasCore.WarlockRitual.SecondStagePilot.Enabled = 0' acore/modules/mod-naxxramas-core/conf/mod_naxxramas_core.conf.dist
          grep -Fxq 'NaxxramasCore.MeetingStones.ClassicMode.Enabled = 1' acore/modules/mod-naxxramas-core/conf/mod_naxxramas_core.conf.dist
          echo 'PASS: owner-reported four source pins and Warlock default-OFF config contract'

      - name: Reproduce precisely the two owner-local Playerbots header changes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          module = Path("acore/modules/mod-playerbots")
          replacements = {
              "src/Db/PlayerbotsDatabase.h": (
                  "MySQLConnection* CreateAsyncConnection(ProducerConsumerQueue<SQLOperation*>* queue,",
                  "MySQLConnection* CreateConnection(ProducerConsumerQueue<SQLOperation*>* queue,"
              ),
              "src/Util/LocaleColumns.h": (
                  "if (!IsLocaleRegistered(locale))",
                  "if (!localeNames[locale])"
              ),
          }
          for relative_path, (old, new) in replacements.items():
              path = module / relative_path
              content = path.read_text(encoding="utf-8")
              assert content.count(old) == 1, f"Expected exact owner patch base is absent: {relative_path}"
              assert content.count(new) == 0, f"Unexpected owner patch already in checkout: {relative_path}"
              path.write_text(content.replace(old, new), encoding="utf-8")
              print(f"Reproduced owner-reported change: {relative_path}")
          PY
          git -C acore/modules/mod-playerbots diff --check
          python3 - <<'PY'
          import subprocess
          cwd = "acore/modules/mod-playerbots"
          names = set(subprocess.check_output(
              ["git", "diff", "--name-only"], cwd=cwd, text=True).splitlines())
          expected = {"src/Db/PlayerbotsDatabase.h", "src/Util/LocaleColumns.h"}
          assert names == expected, names
          stats = subprocess.check_output(
              ["git", "diff", "--numstat"], cwd=cwd, text=True).splitlines()
          assert len(stats) == 2, stats
          for line in stats:
              added, removed, path = line.split("\t", 2)
              assert (added, removed) == ("1", "1"), (path, added, removed)
          print("PASS: only the two protected owner-local Playerbots 1-line edits reproduced")
          PY

      - name: Install dependencies on disposable runner only
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git cmake ninja-build g++ make pkg-config file \
            libmysqlclient-dev libssl-dev libbz2-dev \
            libreadline-dev libncurses-dev libboost-all-dev

      - name: Configure owner-source-matched full Worldserver target
        run: |
          cmake -S acore -B acore-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DMODULES=static -DSCRIPTS=static \
            -DAPPS_BUILD=world-only -DTOOLS_BUILD=none \
            -DUSE_COREPCH=ON -DUSE_SCRIPTPCH=ON

      - name: Verify real owner-source compile graph includes changed Warlock file
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          records = json.loads(Path("acore-build/compile_commands.json").read_text())
          want = "/mod-naxxramas-core/src/Systems/MeetingStoneProgression.cpp"
          hits = [row for row in records if row.get("file", "").replace(chr(92), "/").endswith(want)]
          assert len(hits) == 1, f"Unexpected Warlock P1 compilation count: {len(hits)}"
          print("PASS: owner-source compilation graph contains exact Warlock source")
          PY

      - name: Compile and link owner-source Worldserver without starting it
        run: cmake --build acore-build --target worldserver --parallel 2

      - name: Require linked Warlock virtual GameObject handler and loader
        run: |
          set -euo pipefail
          binary=acore-build/src/server/apps/worldserver
          test -x "$binary" && test -s "$binary"
          nm -C --defined-only "$binary" > "$RUNNER_TEMP/naxx-owner-p1-worldserver-symbols.txt"
          for expected in 'AddMeetingStoneProgressionScripts()' \
                          'NaxxramasCoreMeetingStoneProgression::CanGameObjectGossipHello(' \
                          'vtable for NaxxramasCoreMeetingStoneProgression'; do
            grep -Fq "$expected" "$RUNNER_TEMP/naxx-owner-p1-worldserver-symbols.txt" ||
              { echo "FAIL: linked owner-source Worldserver missing $expected" >&2; exit 1; }
            echo "PASS: linked owner-source Worldserver contains $expected"
          done
          sha256sum "$binary"
          echo 'PASS: disposable four-source version compile with exact local Playerbots changes; NOT owner runtime acceptance'

      - name: Owner-host and gameplay nonauthorization
        if: always()
        run: |
          echo 'All source checkouts, two reproduced local Playerbots edits and compilation occur ONLY on this disposable GitHub runner.'
          echo 'No Worldserver start, binary upload, artifact deploy, live owner-host access, SQL/DBC/client/config changes or backups.'
          echo 'Other installed modules and owner-host binary/config/backups are not proven by this four-repository build.'
          echo 'P1 gameplay remains FAIL until owner-approved full ritual test, target summons, accepts and arrives.'
          echo 'Pilot default OFF; preserve R7 HOLD, F14 OFF, NoWrite relay OFF, D18 HARD NO-GO, MapUpdate.Threads=8.'
