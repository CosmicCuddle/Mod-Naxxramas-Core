name: Mature five-feature same-binary newer Grimfeather and corrected F10 compatibility

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/naxx-mature-five-f10-grimfeather-8daffda.yml'
      - 'src/Events/HallowsEndShadeOfTheHorseman.cpp'
      - 'src/Events/HallowsEndSoloFire.h'
      - 'tests/f10_s2_solo_fire_policy_tests.cpp'
      - 'tests/test_f10_hallows_end_solo_fire_s1.py'
      - 'tests/test_f10_hallows_end_solo_fire_s2.py'
      - 'docs/research/F10-hallows-end-solo-fire-S1.md'
      - '.github/workflows/f10-s2-source-pin.yml'
      - 'src/Systems/BotRaidConsumables.cpp'
      - 'src/Systems/GreaterFireProtectionOneShot.h'
      - 'conf/mod_naxxramas_core.conf.dist'
      - 'tests/test_mc_gfpp_one_shot.py'
      # All other four-feature code, registration, model-test and
      # pinned compile-wrapper changes must re-run this combined build.
      - 'src/NaxxramasCore_loader.cpp'
      - 'src/Systems/HunterAmmoProvision.cpp'
      - 'src/Systems/HunterAmmoProvision.h'
      - 'src/Systems/HunterAmmoSelection.h'
      - 'src/Systems/QuestLootProtection.cpp'
      - 'src/Systems/EasternPlaguelandsTowerLock.cpp'
      - 'tests/hunter_ammo_selection.cpp'
      - 'tests/test_hunter_ammo_consumables.py'
      - 'tests/test_quest_loot_protection.py'
      - 'tests/test_ep_tower_module_only.py'
      - 'scripts/check_hunter_ammo_pinned_compile.py'
      - 'scripts/check_quest_loot_pinned_compile.py'
      - 'scripts/check_ep_module_compile_commands.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naxx-mature-five-f10-newcore-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  source-and-full-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout target updated Grimfeather AzerothCore
        uses: actions/checkout@v4
        with:
          repository: Grimfeather/azerothcore-wotlk
          ref: 8daffdabe9202c228e45d833c9a1d399597a15cd
          path: acore
          persist-credentials: false
      - name: Checkout pinned Playerbots
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: 037c01418b5d01506917a3db9b44fd56ac5f965c
          path: acore/modules/mod-playerbots
          persist-credentials: false
      - name: Checkout pinned Individual Progression
        uses: actions/checkout@v4
        with:
          repository: Grimfeather/mod-individual-progression
          ref: 4ff4b5fcc1480348f058c632573143e62d4e3a41
          path: acore/modules/mod-individual-progression
          persist-credentials: false
      - name: Checkout exact integrated Naxx branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: acore/modules/mod-naxxramas-core
          persist-credentials: false
      - name: Verify exact candidate and dependency SHAs
        run: |
          set -euo pipefail
          test "$(git -C acore rev-parse HEAD)" = 8daffdabe9202c228e45d833c9a1d399597a15cd
          test "$(git -C acore/modules/mod-playerbots rev-parse HEAD)" = 037c01418b5d01506917a3db9b44fd56ac5f965c
          test "$(git -C acore/modules/mod-individual-progression rev-parse HEAD)" = 4ff4b5fcc1480348f058c632573143e62d4e3a41
          test "$(git -C acore/modules/mod-naxxramas-core rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Verify all optional inventory GFPP and corrected F10 effects OFF by default
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("acore/modules/mod-naxxramas-core")
          conf = (root / "conf/mod_naxxramas_core.conf.dist").read_text()
          for key in (
              "NaxxramasCore.QuestLootProtection.Enabled = 0",
              "NaxxramasCore.QuestLootProtection.Debug = 0",
              "NaxxramasCore.BotConsumables.HunterAmmo.Enabled = 0",
              "NaxxramasCore.BotConsumables.HunterAmmo.AllowSelectedNonVendor = 0",
              "NaxxramasCore.BotConsumables.MC.GreaterFireProtection.OneShotEnabled = 0",
              "NaxxramasCore.HallowsEnd.SoloFire.Enabled = 0",
              "NaxxramasCore.HallowsEnd.SoloFire.PeriodMultiplier = 3",
          ):
              assert conf.count(key) == 1, "Missing/duplicated OFF default: " + key
          loader = (root / "src/NaxxramasCore_loader.cpp").read_text()
          assert sum(line.strip() == "AddQuestLootProtectionScripts();" for line in loader.splitlines()) == 1
          assert sum(line.strip() == "void AddQuestLootProtectionScripts();" for line in loader.splitlines()) == 1
          shade = (root / "src/Events/HallowsEndShadeOfTheHorseman.cpp").read_text()
          assert 'soloFireWatches.erase(id);' in shade
          assert 'RetentionForObservation(' in shade
          print("PASS: five-feature defaults, registered Quest Loot, corrected Shade source present.")
          PY
      - name: Run mature four feature tests plus corrected F10 C++ policy
        run: |
          set -euo pipefail
          root=acore/modules/mod-naxxramas-core
          python3 -m unittest discover -s "$root/tests" -p 'test_ep_tower_module_only.py' -v
          python3 -m unittest discover -s "$root/tests" -p 'test_quest_loot_protection.py' -v
          python3 -m unittest discover -s "$root/tests" -p 'test_hunter_ammo_consumables.py' -v
          python3 -m unittest discover -s "$root/tests" -p 'test_mc_gfpp_one_shot.py' -v
          # These tests depend on the original F10 S1 research document and
          # branch-scoped S2 source workflow, now copied unchanged from #52.
          # Pinned-old-core-only cases may skip here; #56 has separate old/new C++ evidence.
          python3 -m unittest discover -s "$root/tests" -p 'test_f10_hallows_end_solo_fire_s1.py' -v
          python3 -m unittest discover -s "$root/tests" -p 'test_f10_hallows_end_solo_fire_s2.py' -v
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I"$root/src/Systems" "$root/tests/hunter_ammo_selection.cpp" -o /tmp/naxx_mature_hunter_ammo_model
          /tmp/naxx_mature_hunter_ammo_model
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I"$root/src/Events" "$root/tests/f10_s2_solo_fire_policy_tests.cpp" -o /tmp/naxx_mature_f10_policy
          /tmp/naxx_mature_f10_policy | tee /tmp/naxx_mature_f10_policy_log
          grep -Fqx 'F10_S2_POLICY_OK' <(tail -n 1 /tmp/naxx_mature_f10_policy_log)
      - name: Install pinned full Worldserver compile dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git cmake ninja-build g++ make pkg-config file \
            libmysqlclient-dev libssl-dev libbz2-dev \
            libreadline-dev libncurses-dev libboost-all-dev
      - name: Configure pinned full Worldserver
        run: |
          cmake -S acore -B acore-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DMODULES=static -DSCRIPTS=static \
            -DAPPS_BUILD=world-only -DTOOLS_BUILD=none \
            -DUSE_COREPCH=ON -DUSE_SCRIPTPCH=ON
      - name: Compile 3 independent C++ units and identify shared MC-Hunter and F10 Shade units
        run: |
          set -euo pipefail
          module=acore/modules/mod-naxxramas-core
          python3 "$module/scripts/check_hunter_ammo_pinned_compile.py" --compile-commands acore-build/compile_commands.json --timeout 360
          python3 "$module/scripts/check_quest_loot_pinned_compile.py" --compile-commands acore-build/compile_commands.json --timeout 360
          python3 "$module/scripts/check_ep_module_compile_commands.py" --compile-commands acore-build/compile_commands.json --timeout 360
          python3 - <<'PY'
          from pathlib import Path
          import json
          commands = json.loads(Path("acore-build/compile_commands.json").read_text())
          units = [x for x in commands if x["file"].endswith("/src/Systems/BotRaidConsumables.cpp")]
          assert len(units) == 1, f"Expected one MC/Hunter Ammo shared C++ unit: {len(units)}"
          source = Path("acore/modules/mod-naxxramas-core/src/Systems/BotRaidConsumables.cpp").read_text()
          assert '#include "GreaterFireProtectionOneShot.h"' in source
          assert 'NaxxramasHunterAmmo::TopUpHunterAmmo(' in source
          shade_units = [x for x in commands if x["file"].endswith("/src/Events/HallowsEndShadeOfTheHorseman.cpp")]
          assert len(shade_units) == 1, f"Expected exactly one corrected Shade C++ unit: {len(shade_units)}"
          print("PASS: MC GFPP/Hunter shared unit and F10 Shade each in full CMake compilation")
          PY
      - name: Link one actual Worldserver containing all five candidates
        run: cmake --build acore-build --target worldserver --parallel 2
      - name: Verify five integrated features in final executable
        run: |
          set -euo pipefail
          binary=acore-build/src/server/apps/worldserver
          archive=acore-build/modules/libmodules.a
          test -s "$archive" && test -s "$binary" && test -x "$binary"
          nm -C --defined-only "$archive" > /tmp/naxx_mature_archive_symbols.txt
          nm -C --defined-only "$binary" > /tmp/naxx_mature_binary_symbols.txt
          grep -Fq 'NaxxramasHunterAmmo::TopUpHunterAmmo(' /tmp/naxx_mature_archive_symbols.txt
          grep -Fq 'NaxxramasHunterAmmo::TopUpHunterAmmo(' /tmp/naxx_mature_binary_symbols.txt
          grep -aFq 'NaxxramasQuestLootProtection' "$binary"
          grep -aFq 'outdoorpvp_naxxramas_ep_lock' "$binary"
          grep -Fq 'AddBotRaidConsumablesScripts()' /tmp/naxx_mature_archive_symbols.txt
          grep -Fq 'AddBotRaidConsumablesScripts()' /tmp/naxx_mature_binary_symbols.txt
          grep -aFq 'NaxxramasCore.BotConsumables.MC.GreaterFireProtection.OneShotEnabled' "$binary"
          grep -Fq 'AddHallowsEndShadeOfTheHorsemanScripts()' /tmp/naxx_mature_archive_symbols.txt
          grep -Fq 'AddHallowsEndShadeOfTheHorsemanScripts()' /tmp/naxx_mature_binary_symbols.txt
          grep -aFq 'NaxxramasCore.HallowsEnd.SoloFire.Enabled' "$binary"
          grep -aFq 'NaxxramasCore.HallowsEnd.SoloFire.PeriodMultiplier' "$binary"
          # The symbol already existed before F10; both config strings distinguish
          # the new optional solo-fire runtime path, not its in-game correctness.
          sha256sum "$binary"
          echo "PASS: Hunter Ammo, Quest Loot, EP, GFPP and corrected F10 retained in ONE linked Worldserver."
      - name: State provisional dependency and no-release boundary
        if: always()
        run: |
          echo "PROVISIONAL compatibility: Grimfeather core pinned 8daffda; Playerbots and Individual Progression revisions are historical CI pins."
          echo "Exact installed Playerbots/IP versions have NOT been confirmed with the owner."
          echo "No server deployment, config/SQL activation, live gameplay or production backup proof is implied."
      - name: State no-release or gameplay acceptance boundary
        if: always()
        run: |
          echo "Build-only source candidate. No server launch, installation, inventory or DB interaction."
          echo "No SQL handler activation, config enablement, merge, or owner acceptance claimed."
