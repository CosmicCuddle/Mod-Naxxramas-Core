name: NT1 Alt Bot recovery offline checks
on:
  pull_request:
    paths:
      - 'src/Systems/BotTalentImport.cpp'
      - 'scripts/audit_nt1_altbot_recovery_backup.py'
      - 'tests/test_nt1_altbot_*.py'
      - '.github/workflows/nt1-altbot-recovery-checks.yml'
  push:
    branches:
      - feature/nt1-altbot-recovery-readonly-checks
    paths:
      - 'src/Systems/BotTalentImport.cpp'
      - 'scripts/audit_nt1_altbot_recovery_backup.py'
      - 'tests/test_nt1_altbot_*.py'
      - '.github/workflows/nt1-altbot-recovery-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-readonly-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out draft review branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test backup verifier and read-only Alt Bot diagnostics
        run: python -m unittest discover -s tests -p 'test_nt1_altbot_*.py' -v
