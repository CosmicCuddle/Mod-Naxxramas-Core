name: P13-R4 Playerbots human/SelfBot helper mask source proof

on:
  pull_request:
    paths:
      - 'tests/test_p13_identity_helpers_config_mask_source.py'
      - '.github/workflows/naxx-p13-identity-helper-source.yml'
  push:
    branches:
      - 'test/cs01-p13-identity-helper-config-mask-20261028'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-source-human-selfbot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm test-only exact 2-path child and no production drift
        shell: bash
        run: |
          set -euo pipefail
          BASE=2db985c340ca45dce6724afd2c302770358063d1
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD > /tmp/changed
          printf '%s\n' \
            '.github/workflows/naxx-p13-identity-helper-source.yml' \
            'tests/test_p13_identity_helpers_config_mask_source.py' > /tmp/allowed
          diff -u /tmp/allowed /tmp/changed
          for path in \
            src/Systems/HonorOverflow.cpp \
            conf/mod_naxxramas_core.conf.dist \
            tests/test_honoroverflow_masked_bot_source_witness.py \
            tests/test_p13_playerbots_reload_transition_source.py \
            tests/test_p13_playerbots_masked_destruction_source.py \
            tests/test_p13_playerbots_masked_bulk_logout_source.py; do
            test "$(git show "$BASE":"$path" | sha256sum | cut -d' ' -f1)" = \
                 "$(sha256sum "$path" | cut -d' ' -f1)"
          done
      - uses: actions/checkout@v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: d750b4b3a50effdf22bedc8032f0e8e5f7cb8091
          path: pinned-playerbots
          fetch-depth: 1
          sparse-checkout: |
            src/Bot/PlayerbotAI.cpp
            src/Bot/PlayerbotMgr.cpp
            src/Bot/RandomPlayerbotMgr.cpp
            src/PlayerbotAIConfig.cpp
            src/Script/Playerbots.cpp
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: Grimfeather/azerothcore-wotlk
          ref: 8daffdabe9202c228e45d833c9a1d399597a15cd
          path: pinned-core
          fetch-depth: 1
          sparse-checkout: |
            src/server/game/World/World.cpp
            src/server/scripts/Commands/cs_reload.cpp
          sparse-checkout-cone-mode: false
      - name: Execute exact pinned source helpers in strict C++17 and C++20
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pinned-playerbots rev-parse HEAD)" = \
               d750b4b3a50effdf22bedc8032f0e8e5f7cb8091
          test "$(git -C pinned-core rev-parse HEAD)" = \
               8daffdabe9202c228e45d833c9a1d399597a15cd
          python3 -m py_compile tests/test_p13_identity_helpers_config_mask_source.py
          python3 tests/test_p13_identity_helpers_config_mask_source.py
