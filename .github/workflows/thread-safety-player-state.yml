name: "#114 per-player state thread safety (pinned Worldserver link)"

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'src/Systems/HonorOverflow.cpp'
      - 'src/Systems/ForcedPvP.cpp'
      - 'src/Systems/BotRaidConsumables.cpp'
      - 'src/Class/Warrior/WarriorRendFlurryBots.cpp'
      - 'src/Class/Warlock/WarlockWrackBots.cpp'
      - 'tests/test_thread_safety_player_state.py'
      - '.github/workflows/thread-safety-player-state.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naxx-114-thread-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Source contract and existing feature suites
        run: |
          set -euo pipefail
          python3 -m unittest tests/test_thread_safety_player_state.py -v
          python3 -m unittest tests/test_mc_gfpp_one_shot.py -v
          python3 -m unittest tests/test_hunter_ammo_consumables.py -v

  pinned-worldserver-link:
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout exact Grimfeather AzerothCore
        uses: actions/checkout@v4
        with:
          repository: Grimfeather/azerothcore-wotlk
          ref: 8daffdabe9202c228e45d833c9a1d399597a15cd
          path: acore
          persist-credentials: false
      - name: Checkout pinned Playerbots
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: d750b4b3a50effdf22bedc8032f0e8e5f7cb8091
          path: acore/modules/mod-playerbots
          persist-credentials: false
      - name: Checkout pinned Individual Progression
        uses: actions/checkout@v4
        with:
          repository: Grimfeather/mod-individual-progression
          ref: dd96f2b77e3ebfa2a4726bf785525ba133f1ab61
          path: acore/modules/mod-individual-progression
          persist-credentials: false
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/Mod-Naxxramas-Core
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: acore/modules/mod-naxxramas-core
          persist-credentials: false
      - name: Enforce exact snapshot SHAs
        run: |
          set -euo pipefail
          test "$(git -C acore rev-parse HEAD)" = 8daffdabe9202c228e45d833c9a1d399597a15cd
          test "$(git -C acore/modules/mod-playerbots rev-parse HEAD)" = d750b4b3a50effdf22bedc8032f0e8e5f7cb8091
          test "$(git -C acore/modules/mod-individual-progression rev-parse HEAD)" = dd96f2b77e3ebfa2a4726bf785525ba133f1ab61
          test "$(git -C acore/modules/mod-naxxramas-core rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Install compiler dependencies on disposable runner
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git cmake ninja-build g++ make pkg-config file \
            libmysqlclient-dev libssl-dev libbz2-dev \
            libreadline-dev libncurses-dev libboost-all-dev
      - name: Configure full pinned Worldserver and all modules
        run: |
          cmake -S acore -B acore-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DMODULES=static -DSCRIPTS=static \
            -DAPPS_BUILD=world-only -DTOOLS_BUILD=none \
            -DUSE_COREPCH=ON -DUSE_SCRIPTPCH=ON
      - name: Compile the five changed translation units first
        run: |
          set -euo pipefail
          obj=modules/CMakeFiles/modules.dir/mod-naxxramas-core/src
          ninja -C acore-build \
            "$obj/Systems/HonorOverflow.cpp.o" \
            "$obj/Systems/ForcedPvP.cpp.o" \
            "$obj/Systems/BotRaidConsumables.cpp.o" \
            "$obj/Class/Warrior/WarriorRendFlurryBots.cpp.o" \
            "$obj/Class/Warlock/WarlockWrackBots.cpp.o"
      - name: Build and link full Worldserver without launching
        run: cmake --build acore-build --target worldserver --parallel 2
      - name: Verify the five script loaders are in the linked executable
        run: |
          set -euo pipefail
          binary=acore-build/src/server/apps/worldserver
          test -s "$binary" && test -x "$binary"
          nm -C --defined-only "$binary" > /tmp/naxx114_symbols.txt
          for fn in AddHonorOverflowScripts AddForcedPvPScripts AddBotRaidConsumablesScripts \
                    AddWarriorRendFlurryBotScripts AddWarlockWrackBotScripts; do
            grep -Eq " T ${fn}\(\)$" /tmp/naxx114_symbols.txt
            echo "PASS linked: ${fn}"
          done
          echo "S4 build/link only. This does not prove the data race is gone at runtime."
