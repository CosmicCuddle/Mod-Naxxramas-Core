name: "F14 P1 player identity classifier (pure C++, not wired)"

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'src/Systems/PlayerIdentityPolicy.h'
      - 'tests/f14_player_identity_policy_tests.cpp'
      - 'tests/f14_player_identity_mutants.py'
      - 'docs/research/F14-PLAYER-IDENTITY-CLASSIFIER.md'
      - '.github/workflows/f14-player-identity-classifier.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f14-identity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  BASE_MAIN: 80e9de1c39a6dc995188a80c31a5e785d0f2a6f9

jobs:
  classifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: "Child of main; only the five P1 paths differ; nothing wired"
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_MAIN" HEAD
          allowed='src/Systems/PlayerIdentityPolicy.h
          tests/f14_player_identity_policy_tests.cpp
          tests/f14_player_identity_mutants.py
          docs/research/F14-PLAYER-IDENTITY-CLASSIFIER.md
          .github/workflows/f14-player-identity-classifier.yml'
          git diff --name-only "$BASE_MAIN" HEAD | while read -r path; do
            printf '%s\n' "$allowed" | sed 's/^ *//' | grep -Fxq "$path" \
              || { echo "unexpected changed path: $path"; exit 1; }
          done
          # Not wired: no module source or config includes or names it.
          ! grep -rn 'PlayerIdentityPolicy\|NaxxramasPlayerIdentity' src conf \
              --exclude=PlayerIdentityPolicy.h
          # Pure standard C++: only <...> standard headers, no core/Playerbots.
          ! grep -n '#include "' src/Systems/PlayerIdentityPolicy.h
      - name: GCC C++17 and C++20, strict warnings
        run: |
          set -euo pipefail
          for std in 17 20; do
            g++ -std=c++$std -Wall -Wextra -Werror -pedantic -Wshadow -Wconversion -pthread \
              -Isrc/Systems tests/f14_player_identity_policy_tests.cpp -o /tmp/f14id_$std
            /tmp/f14id_$std | tee /tmp/f14id_$std.txt
            grep -qx 'PASS: F14 identity classifier, 2936 checks' /tmp/f14id_$std.txt
          done
      - name: Clang C++17
        run: |
          set -euo pipefail
          clang++ -std=c++17 -Wall -Wextra -Werror -pedantic -pthread \
            -Isrc/Systems tests/f14_player_identity_policy_tests.cpp -o /tmp/f14id_clang
          /tmp/f14id_clang
      - name: AddressSanitizer + UndefinedBehaviorSanitizer
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -pthread \
            -Isrc/Systems tests/f14_player_identity_policy_tests.cpp -o /tmp/f14id_asan
          /tmp/f14id_asan
      - name: ThreadSanitizer (one publisher, four readers)
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -g -fsanitize=thread -pthread \
            -Isrc/Systems tests/f14_player_identity_policy_tests.cpp -o /tmp/f14id_tsan
          TSAN_OPTIONS=halt_on_error=1 /tmp/f14id_tsan
      - name: Must-fail mutants (22)
        run: |
          set -euo pipefail
          python3 -I tests/f14_player_identity_mutants.py src/Systems/PlayerIdentityPolicy.h /tmp/f14mut \
            | tee /tmp/f14mut.txt
          grep -qx '22/22 mutants caught' /tmp/f14mut.txt
      - name: Scope of proof
        run: |
          echo 'Pure classifier and snapshot only. Not included by any module source; F14 stays default OFF.'
          echo 'No core, Playerbots, Individual Progression, SQL, DBC or config change. No server run.'
          echo 'The world-thread adapter and /who wiring are NOT built or tested here.'
