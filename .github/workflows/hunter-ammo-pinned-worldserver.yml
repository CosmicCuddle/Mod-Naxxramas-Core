name: Hunter ammo pinned Grimfeather Worldserver

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'src/Systems/HunterAmmoSelection.h'
      - 'src/Systems/HunterAmmoProvision.h'
      - 'src/Systems/HunterAmmoProvision.cpp'
      - 'src/Systems/BotRaidConsumables.cpp'
      - 'scripts/check_hunter_ammo_pinned_compile.py'
      - 'conf/mod_naxxramas_core.conf.dist'
      - 'tests/hunter_ammo_selection.cpp'
      - 'tests/test_hunter_ammo_consumables.py'
      - '.github/workflows/hunter-ammo-pinned-worldserver.yml'
  workflow_dispatch:

permissions:
  contents: read

# Keep an expensive, exact-commit build intact even if another small
# follow-up commit arrives; a success is only for its original SHA.
concurrency:
  group: hunter-ammo-pinned-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  exact-pinned-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout exact Grimfeather AzerothCore
        uses: actions/checkout@v4
        with:
          repository: Grimfeather/azerothcore-wotlk
          ref: a66f1bede6f5d905d9ab815715b4e2ee1c1f48e7
          path: acore
          persist-credentials: false
      - name: Checkout exact compatible Playerbots
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: 037c01418b5d01506917a3db9b44fd56ac5f965c
          path: acore/modules/mod-playerbots
          persist-credentials: false
      - name: Checkout exact Individual Progression
        uses: actions/checkout@v4
        with:
          repository: Grimfeather/mod-individual-progression
          ref: 4ff4b5fcc1480348f058c632573143e62d4e3a41
          path: acore/modules/mod-individual-progression
          persist-credentials: false
      - name: Checkout exact draft Naxxramas Core head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: acore/modules/mod-naxxramas-core
          persist-credentials: false
      - name: Verify source revision pins
        run: |
          set -euo pipefail
          test "$(git -C acore rev-parse HEAD)" = "a66f1bede6f5d905d9ab815715b4e2ee1c1f48e7"
          test "$(git -C acore/modules/mod-playerbots rev-parse HEAD)" = "037c01418b5d01506917a3db9b44fd56ac5f965c"
          test "$(git -C acore/modules/mod-individual-progression rev-parse HEAD)" = "4ff4b5fcc1480348f058c632573143e62d4e3a41"
          test "$(git -C acore/modules/mod-naxxramas-core rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Run source and standalone C++ ammo selection tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s acore/modules/mod-naxxramas-core/tests -p 'test_hunter_ammo_consumables.py' -v
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Iacore/modules/mod-naxxramas-core/src/Systems \
            acore/modules/mod-naxxramas-core/tests/hunter_ammo_selection.cpp \
            -o /tmp/hunter_ammo_selection_test
          /tmp/hunter_ammo_selection_test
      - name: Install Worldserver build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git cmake ninja-build g++ make pkg-config file \
            libmysqlclient-dev libssl-dev libbz2-dev \
            libreadline-dev libncurses-dev libboost-all-dev
      - name: Configure exact module and full script build
        run: |
          cmake -S acore -B acore-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DMODULES=static -DSCRIPTS=static \
            -DAPPS_BUILD=world-only -DTOOLS_BUILD=none \
            -DUSE_COREPCH=ON -DUSE_SCRIPTPCH=ON
      - name: Compile actual HunterAmmoProvision C++ translation unit
        run: |
          python3 acore/modules/mod-naxxramas-core/scripts/check_hunter_ammo_pinned_compile.py \
            --compile-commands acore-build/compile_commands.json --timeout 360
      - name: Link full pinned Worldserver without starting it
        run: cmake --build acore-build --target worldserver --parallel 2
      - name: Verify Hunter ammo code linked into Worldserver binary
        run: |
          set -euo pipefail
          binary="$(find acore-build -type f -name worldserver -print -quit)"
          test -n "$binary" && test -s "$binary"
          grep -aFq 'NaxxramasCore.BotConsumables.HunterAmmo.Enabled' "$binary"
          echo "PASS: optional Hunter ammo source is present in linked Worldserver."
      - name: No live inventory test performed
        if: always()
        run: |
          echo "A pinned build cannot prove inventory grants, IP semantics, bot ranged combat, or live config."
          echo "No Worldserver launch, SQL/DBC edits, external Playerbots or IP changes."
