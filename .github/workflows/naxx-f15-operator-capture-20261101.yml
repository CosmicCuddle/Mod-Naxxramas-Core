name: F15 actual operator capture - disposable tests only

on:
  push:
    branches:
      - dev/cs01-f15-operational-log-capture-20261101
  pull_request:
    paths:
      - scripts/f15_operator_collector.py
      - scripts/f15_archive_retention.py
      - scripts/f15_process_supervisor.py
      - scripts/f15_pm2_observer.py
      - tests/test_f15_operator_collector.py
      - tests/test_f15_archive_retention.py
      - tests/test_f15_process_supervisor.py
      - tests/test_f15_pm2_observer.py
      - docs/research/F15-OPERATIONAL-CAPTURE-FIRST-DRAFT.md
      - .github/workflows/naxx-f15-operator-capture-20261101.yml
  workflow_dispatch:

jobs:
  safe-offline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Compile actual operator program
        run: python3 -m py_compile scripts/f15_operator_collector.py scripts/f15_archive_retention.py scripts/f15_process_supervisor.py tests/test_f15_operator_collector.py scripts/f15_pm2_observer.py tests/test_f15_pm2_observer.py tests/test_f15_archive_retention.py tests/test_f15_process_supervisor.py
      - name: Execute operator implementation against disposable fake files
        run: |
          python3 -m unittest discover -s tests -p test_f15_operator_collector.py -v
          python3 -m unittest discover -s tests -p test_f15_archive_retention.py -v
          python3 -m unittest discover -s tests -p test_f15_process_supervisor.py -v
          python3 -m unittest discover -s tests -p test_f15_pm2_observer.py -v
      - name: Check deliberate no-delete stage boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/f15_operator_collector.py").read_text()
          assert "def collect_once(" in p and "def main(" in p
          assert "--capture" in p and "--include-existing-on-first-poll" in p
          assert "--retention-30d" in p
          assert "retention-intent.json" in p
          assert "def retain_once(" in Path("scripts/f15_archive_retention.py").read_text()
          supervisor = Path("scripts/f15_process_supervisor.py").read_text()
          assert "--execute" in supervisor and "subprocess.Popen(" in supervisor
          pm2 = Path("scripts/f15_pm2_observer.py").read_text()
          assert "pm2" in pm2 and "jlist" in pm2 and "--observe" in pm2
          assert "subprocess.Popen(" not in pm2 and "os.kill(" not in pm2
          assert "crash_proven" in pm2 and "False" in pm2
          assert "os.unlink(" not in p and ".unlink(" not in p
          assert "shutil.rmtree" not in p and "subprocess." not in p
          assert "--retention-30d" in p and 'action="store_true"' in p
          print("PASS: real capture, supervisor and explicit-ONLY 30d retention tested on disposable files")
          print("PASS: read-only PM2 observer plus collector, supervisor and opt-in retention covered by disposable tests")
          PY
