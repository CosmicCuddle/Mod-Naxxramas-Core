name: First controlled test build - historical owner-pinned Worldserver real link
on:
  push:
    branches: ['test/cs01-first-controlled-build-readiness-20261029']
    paths:
      - scripts/check_first_controlled_test_build.py
      - docs/testing/2026-10-29_FIRST_CONTROLLED_BUILD.md
      - .github/workflows/naxx-first-controlled-build.yml
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: naxx-first-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  actual-linked-worldserver:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout exact Grimfeather AzerothCore
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/azerothcore-wotlk
          ref: b7f06a16ac7120b5abc2e8d3f96a94265a363224
          path: acore
          persist-credentials: false
      - name: Checkout historical pinned Playerbots
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: 037c01418b5d01506917a3db9b44fd56ac5f965c
          path: acore/modules/mod-playerbots
          persist-credentials: false
      - name: Checkout historical pinned Individual Progression
        uses: actions/checkout@v4
        with:
          repository: ZhengPeiRu21/mod-individual-progression
          ref: 283abe12774801e5671da746ea8bf535cc0252e0
          path: acore/modules/mod-individual-progression
          persist-credentials: false
      - name: Checkout exact first controlled candidate WITH protected main history
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/Mod-Naxxramas-Core
          ref: ${{ github.sha }}
          path: acore/modules/mod-naxxramas-core
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce four exact SHA pins and opt-in defaults
        run: |
          set -euo pipefail
          test "$(git -C acore rev-parse HEAD)" = b7f06a16ac7120b5abc2e8d3f96a94265a363224
          test "$(git -C acore/modules/mod-playerbots rev-parse HEAD)" = 037c01418b5d01506917a3db9b44fd56ac5f965c
          test "$(git -C acore/modules/mod-individual-progression rev-parse HEAD)" = 283abe12774801e5671da746ea8bf535cc0252e0
          test "$(git -C acore/modules/mod-naxxramas-core rev-parse HEAD)" = "${{ github.sha }}"
          conf=acore/modules/mod-naxxramas-core/conf/mod_naxxramas_core.conf.dist
          grep -Fqx 'NaxxramasCore.BotConsumables.MC.GreaterFireProtection.OneShotEnabled = 0' "$conf"
          grep -Fqx 'NaxxramasCore.BotConsumables.HunterAmmo.Enabled = 0' "$conf"
          grep -Fqx 'NaxxramasCore.BotConsumables.HunterAmmo.AllowSelectedNonVendor = 0' "$conf"
          grep -Fqx 'NaxxramasCore.HallowsEnd.SoloFire.DisableSpread = 0' "$conf"
          grep -Fqx 'NaxxramasCore.QuestLootProtection.Enabled = 0' "$conf"
          grep -Fqx 'NaxxramasCore.QuestLootProtection.Debug = 0' "$conf"
          grep -Fqx 'NaxxramasCore.Playerbots.GolemaggActionAudit.Enabled = 0' "$conf"
          grep -Fqx 'NaxxramasCore.Playerbots.GolemaggActionAudit.AllowedBotName = ""' "$conf"
          grep -Fq 'AddQuestLootProtectionScripts();' acore/modules/mod-naxxramas-core/src/NaxxramasCore_loader.cpp
          grep -Fxq '    AddBotGolemaggActionAuditScripts();' acore/modules/mod-naxxramas-core/src/NaxxramasCore_loader.cpp
      - name: Verify protected main unchanged, EXACTLY 3 additive nonproduction files
        run: |
          set -euo pipefail
          mod=acore/modules/mod-naxxramas-core
          git -C "$mod" merge-base --is-ancestor 80e9de1c39a6dc995188a80c31a5e785d0f2a6f9 HEAD
          git -C "$mod" diff --quiet 80e9de1c39a6dc995188a80c31a5e785d0f2a6f9 HEAD -- src conf data
          python3 - <<'PY'
          import subprocess
          m="acore/modules/mod-naxxramas-core"
          changes=[x.split('\t',1) for x in subprocess.check_output(
            ["git","-C",m,"diff","--name-status",
             "80e9de1c39a6dc995188a80c31a5e785d0f2a6f9","HEAD"],text=True).splitlines()]
          allowed={
            "scripts/check_first_controlled_test_build.py",
            "docs/testing/2026-10-29_FIRST_CONTROLLED_BUILD.md",
            ".github/workflows/naxx-first-controlled-build.yml"
          }
          assert len(changes)==3 and all(k=="A" for k,p in changes),changes
          assert {p for k,p in changes}==allowed,changes
          print("PASS: first build DRAFT only three additive test/doc/CI paths")
          PY
      - name: Generate and verify OFF baseline config outside checkout
        run: |
          set -euo pipefail
          python3 acore/modules/mod-naxxramas-core/scripts/check_first_controlled_test_build.py \
            --output /tmp/naxx-first-test/mod_naxxramas_core.conf
          for key in \
            NaxxramasCore.HonorOverflow.Enabled \
            NaxxramasCore.HonorReset.Enabled \
            NaxxramasCore.ForcedPvP.Enabled \
            NaxxramasCore.MeetingStones.ClassicMode.Enabled \
            NaxxramasCore.BotConsumables.HunterAmmo.Enabled; do
            grep -Fxq "$key = 0" /tmp/naxx-first-test/mod_naxxramas_core.conf
          done
      - name: Test both timer and Hunter ammo safety before compilation
        run: |
          set -euo pipefail
          tests=acore/modules/mod-naxxramas-core/tests
          python3 -m unittest discover -s "$tests" -p 'test_mc_gfpp_one_shot.py' -v
          python3 -m unittest discover -s "$tests" -p 'test_hunter_ammo_consumables.py' -v
          python3 -m unittest discover -s "$tests" -p 'test_quest_loot_protection.py' -v
          python3 -m unittest discover -s "$tests" -p 'test_golemagg_action_audit.py' -v
          python3 -m unittest discover -s "$tests" -p 'test_meeting_stone_ritual_isolation.py' -v
          python3 -m unittest discover -s "$tests" -p 'test_ep_tower_module_only.py' -v
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Iacore/modules/mod-naxxramas-core/src/Systems \
            "$tests/hunter_ammo_selection.cpp" -o /tmp/naxx_p2p3_ammo_policy
          /tmp/naxx_p2p3_ammo_policy
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic \
            -Iacore/modules/mod-naxxramas-core/src/Systems \
            "$tests/golemagg_action_audit_allowlist.cpp" -o /tmp/naxx_golemagg_allowlist
          /tmp/naxx_golemagg_allowlist
      - name: Install compiler dependencies on disposable GitHub runner
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git cmake ninja-build g++ make pkg-config file \
            libmysqlclient-dev libssl-dev libbz2-dev \
            libreadline-dev libncurses-dev libboost-all-dev
      - name: Configure full pinned Worldserver and all modules
        run: |
          cmake -S acore -B acore-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DMODULES=static -DSCRIPTS=static \
            -DAPPS_BUILD=world-only -DTOOLS_BUILD=none \
            -DUSE_COREPCH=ON -DUSE_SCRIPTPCH=ON
      - name: Require both GFPP and Hunter ammo translation units
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          commands = json.loads(Path("acore-build/compile_commands.json").read_text())
          for file in ("BotRaidConsumables.cpp", "HunterAmmoProvision.cpp", "QuestLootProtection.cpp", "BotGolemaggActionAudit.cpp", "HonorOverflow.cpp"):
              matches = [x for x in commands if
                         x.get("file","").replace("\\","/").endswith(
                         "/mod-naxxramas-core/src/Systems/" + file)]
              assert len(matches) == 1, (file, len(matches))
              print("PASS real pinned compile command:", file)
          PY
      - name: Compile actual HunterAmmoProvision implementation independently
        run: |
          python3 acore/modules/mod-naxxramas-core/scripts/check_hunter_ammo_pinned_compile.py \
            --compile-commands acore-build/compile_commands.json --timeout 360
      - name: Compile actual QuestLootProtection implementation independently
        run: |
          python3 acore/modules/mod-naxxramas-core/scripts/check_quest_loot_pinned_compile.py \
            --compile-commands acore-build/compile_commands.json --timeout 360
      - name: Compile real Golemagg read-only audit implementation independently
        run: |
          python3 acore/modules/mod-naxxramas-core/scripts/check_golemagg_action_audit_pinned_compile.py \
            --compile-commands acore-build/compile_commands.json --timeout 360
      - name: Build and link real combined Worldserver without launching
        run: cmake --build acore-build --target worldserver --parallel 2
      - name: Verify all four implementations in archive and linked executable
        run: |
          set -euo pipefail
          binary=acore-build/src/server/apps/worldserver
          archive=acore-build/modules/libmodules.a
          test -s "$archive" && test -s "$binary" && test -x "$binary"
          nm -C --defined-only "$archive" > /tmp/naxx_p2p3_archive_symbols.txt
          nm -C --defined-only "$binary" > /tmp/naxx_p2p3_worldserver_symbols.txt
          for f in /tmp/naxx_p2p3_archive_symbols.txt /tmp/naxx_p2p3_worldserver_symbols.txt; do
            grep -Fq 'AddBotRaidConsumablesScripts()' "$f"
            grep -Fq 'NaxxramasHunterAmmo::TopUpHunterAmmo(' "$f"
            grep -Fq 'AddQuestLootProtectionScripts()' "$f"
            grep -Fq 'AddBotGolemaggActionAuditScripts()' "$f"
          done
          grep -aFq 'NaxxramasCoreGolemaggActionAudit' "$binary"
          sha256sum "$binary"
          echo 'PASS: combined GFPP/consumables, Hunter ammunition, Quest Loot, and read-only Golemagg audit are defined in final linked Worldserver.'
      - name: Capture build fingerprint in logs only - no uploaded artifact
        run: |
          set -euo pipefail
          binary=acore-build/src/server/apps/worldserver
          test -s "$binary" && test -x "$binary"
          mkdir -p /tmp/naxx-first-test
          {
            echo "FIRST CONTROLLED TEST BUILD / REVIEW ONLY - DO NOT INSTALL"
            echo "Candidate module HEAD: $GITHUB_SHA"
            echo "Historical owner-reported core: b7f06a16ac7120b5abc2e8d3f96a94265a363224"
            echo "Historical owner-reported Playerbots: 037c01418b5d01506917a3db9b44fd56ac5f965c"
            echo "Historical owner-reported IP: 283abe12774801e5671da746ea8bf535cc0252e0"
            echo "Owner's current installed source and config are UNKNOWN"
            sha256sum "$binary"
            file "$binary"
          } | tee /tmp/naxx-first-test/BUILD-FINGERPRINT.txt
      - name: Preserve safety boundary
        if: always()
        run: |
          echo 'Pinned build is not owner-installed version and not gameplay validation.'
          echo 'Golemagg observer OFF with empty allowlist; not a movement fix or evidence of actions in-game.'
          echo 'No Worldserver launched; no SQL, DBC, server config, Playerbots, IP or character inventory changed.'
          echo 'No merge, published binary or release performed.'
          echo 'Historical source compatibility only; actual owner-installed revisions are NOT reverified.'
          echo 'Temporary OFF profile not installed. HonorOverflow R7 HOLD, owner gameplay 0/5.'
