name: EP module-only pinned source compile
on:
  pull_request:
    # Push validates every relevant commit on the feature branch; avoid
    # duplicate expensive runs on every pull_request.synchronize event.
    # Still run when an eligible PR is first opened or reopened.
    types: [opened, reopened]
    paths:
      - 'src/Systems/EasternPlaguelandsTowerLock.cpp'
      - 'src/NaxxramasCore_loader.cpp'
      - 'scripts/check_ep_module_compile_commands.py'
      - 'tests/test_ep_tower_module_only.py'
      - 'docs/install/2026_10_13_00_ep_tower_lock_module_bind.sql'
      - 'docs/rollback/2026_10_13_00_ep_tower_lock_module_unbind.sql'
      - '.github/workflows/ep-module-pinned-compile.yml'
  push:
    branches: [feature/ep-tower-lock-module-only]
    paths:
      - 'src/Systems/EasternPlaguelandsTowerLock.cpp'
      - 'src/NaxxramasCore_loader.cpp'
      - 'scripts/check_ep_module_compile_commands.py'
      - 'tests/test_ep_tower_module_only.py'
      - 'docs/install/2026_10_13_00_ep_tower_lock_module_bind.sql'
      - 'docs/rollback/2026_10_13_00_ep_tower_lock_module_unbind.sql'
      - '.github/workflows/ep-module-pinned-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-module-and-check-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout pinned Playerbots-compatible AzerothCore
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/azerothcore-wotlk
          ref: b7f06a16ac7120b5abc2e8d3f96a94265a363224
          path: acore
          persist-credentials: false
      - name: Checkout pinned Playerbots module
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: 037c01418b5d01506917a3db9b44fd56ac5f965c
          path: acore/modules/mod-playerbots
          persist-credentials: false
      - name: Checkout pinned Individual Progression
        uses: actions/checkout@v4
        with:
          repository: ZhengPeiRu21/mod-individual-progression
          ref: 283abe12774801e5671da746ea8bf535cc0252e0
          path: acore/modules/mod-individual-progression
          persist-credentials: false
      - name: Checkout exact Naxxramas module commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: acore/modules/mod-naxxramas-core
          persist-credentials: false
      - name: Verify four pinned revisions
        run: |
          set -euo pipefail
          test "$(git -C acore rev-parse HEAD)" = "b7f06a16ac7120b5abc2e8d3f96a94265a363224"
          test "$(git -C acore/modules/mod-playerbots rev-parse HEAD)" = "037c01418b5d01506917a3db9b44fd56ac5f965c"
          test "$(git -C acore/modules/mod-individual-progression rev-parse HEAD)" = "283abe12774801e5671da746ea8bf535cc0252e0"
          test "$(git -C acore/modules/mod-naxxramas-core rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Test source contract and synthetic lock transitions
        run: python3 -m unittest discover -s acore/modules/mod-naxxramas-core/tests -p 'test_ep_tower_module_only.py' -v
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git cmake ninja-build g++ make pkg-config \
            libmysqlclient-dev libssl-dev libbz2-dev \
            libreadline-dev libncurses-dev libboost-all-dev
      - name: Configure actual core without stub headers
        run: |
          cmake -S acore -B acore-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DMODULES=static -DSCRIPTS=static -DAPPS_BUILD=world-only \
            -DTOOLS_BUILD=none -DUSE_COREPCH=OFF -DUSE_SCRIPTPCH=OFF
      - name: Compile actual EP module translation unit
        run: |
          python3 acore/modules/mod-naxxramas-core/scripts/check_ep_module_compile_commands.py \
            --compile-commands acore-build/compile_commands.json --timeout 360
      - name: Disclose limitations
        if: always()
        run: |
          echo "Syntax/source compile only. No full Worldserver link, migration, gameplay or owner installation."
