name: "F15 retained rotated-inode tail (fake files ONLY)"

on:
  pull_request:
    branches:
      - test/cs01-f15-consented-source-poll-20261031
    paths:
      - tests/f15_retained_old_inode_poll.py
      - tests/test_f15_retained_old_inode_poll.py
      - docs/research/F15-RETAINED-OLD-INODE-TAIL.md
      - .github/workflows/naxx-f15-retained-old-inode-20261031.yml
      - .github/workflows/naxx-f15-consented-source-poll-20261031.yml

  push:
    branches:
      - test/cs01-f15-retained-old-inode-drain-20261031
    paths:
      - tests/f15_retained_old_inode_poll.py
      - tests/test_f15_retained_old_inode_poll.py
      - docs/research/F15-RETAINED-OLD-INODE-TAIL.md
      - .github/workflows/naxx-f15-retained-old-inode-20261031.yml

permissions:
  contents: read

concurrency:
  group: f15-rotated-old-tail-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  retained-read-only-tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR head, never base or mutable default
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Four new paths plus two precisely scoped inherited CI-only extensions
        shell: bash
        run: |
          set -euo pipefail
          BASE=c908304ff7248faf852f2e61f16dbe4bc08ce3f2
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --check "$BASE" HEAD
          git diff --quiet "$BASE" HEAD -- src conf data tools
          git diff --name-status "$BASE" HEAD | sort > /tmp/actual.txt
          printf '%s\n' \
            'M	.github/workflows/naxx-f15-consented-source-poll-20261031.yml' \
            'M	.github/workflows/naxx-f15-integrated-disposable-20261031.yml' \
            'A	.github/workflows/naxx-f15-retained-old-inode-20261031.yml' \
            'A	docs/research/F15-RETAINED-OLD-INODE-TAIL.md' \
            'A	tests/f15_retained_old_inode_poll.py' \
            'A	tests/test_f15_retained_old_inode_poll.py' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base = "c908304ff7248faf852f2e61f16dbe4bc08ce3f2"
          p = ".github/workflows/naxx-f15-consented-source-poll-20261031.yml"
          prior = subprocess.check_output(["git", "show", base+":"+p], text=True)
          old = "      - name: Freeze runtime and ancestors; four additions only\n        shell: bash"
          new = """      - name: Freeze runtime and ancestors; four additions only
        # Original #258 exact-four-path assertion is specific to its own branch.
        # Keep all 15+16 inherited regression cases active on later child PRs.
        if: >-
          (github.event_name == 'pull_request' && github.head_ref == 'test/cs01-f15-consented-source-poll-20261031') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/test/cs01-f15-consented-source-poll-20261031')
        shell: bash"""
          assert prior.count(old) == 1
          marker = "      - name: Evidence boundary\n        if: always()"
          extra = """      - name: Retained old-inode tests on the isolated #259 child only
        if: github.event_name == 'pull_request' && github.head_ref == 'test/cs01-f15-retained-old-inode-drain-20261031'
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" != 0
          python3 -I -B -W error -m unittest discover -s tests -p 'test_f15_retained_old_inode_poll.py' -v
"""
          assert prior.count(marker) == 1
          expected = prior.replace(old, new).replace(marker, extra + marker)
          assert Path(p).read_text() == expected
          p2 = ".github/workflows/naxx-f15-integrated-disposable-20261031.yml"
          prior2 = subprocess.check_output(["git", "show", base+":"+p2], text=True)
          now2 = Path(p2).read_text()
          for first, nextstep in (
              ('      - name: "CS01 F15 #259 six-path source scope (child branch only)"', '      - name: Not root (so the unreadable-source test runs)'),
              ('      - name: "CS01 #259 fake old-inode rotation tests (child branch only)"', '      - name: Scope of proof'),
          ):
              assert now2.count("\n" + first + "\n") == 1 and now2.count("\n" + nextstep + "\n") == 1
              i = now2.index("\n" + first + "\n") + 1
              j = now2.index("\n" + nextstep + "\n", i) + 1
              now2 = now2[:i] + now2[j:]
          assert now2 == prior2
          PY
          echo 'PASS: four additions, two exact CI-only extensions; no runtime edits'
      - name: Source admission, fd bridge, retained old inode test suites
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" != 0
          python3 -I -B -W error -m unittest discover -s tests -p 'test_f15_source_admission.py' -v
          python3 -I -B -W error -m unittest discover -s tests -p 'test_f15_consented_source_poll.py' -v
          python3 -I -B -W error -m unittest discover -s tests -p 'test_f15_retained_old_inode_poll.py' -v
      - name: Scope of proof
        if: always()
        run: |
          echo 'Only fake external files were read. Journal workspace is disposable.'
          echo 'Original read-only fd retained across fake rename; NO automatic adoption.'
          echo 'No owner/PM2/tmux/Auth/World files or config modified. NOT operational.'
