name: "#114 cross-map bot aura safety (default OFF)"

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'src/Systems/BotRaidConsumables.cpp'
      - 'src/Systems/CrossMapAuraQueue.h'
      - 'conf/mod_naxxramas_core.conf.dist'
      - 'tests/test_crossmap_aura_safety.py'
      - 'tests/crossmap_aura_queue.cpp'
      - '.github/workflows/crossmap-aura-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naxx-114-crossmap-auras-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  source-and-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Source contract and existing consumables suites
        run: |
          set -euo pipefail
          python3 -m unittest tests/test_crossmap_aura_safety.py -v
          python3 -m unittest tests/test_mc_gfpp_one_shot.py -v
          python3 -m unittest tests/test_hunter_ammo_consumables.py -v
      - name: Native queue tests (C++17, C++20, ThreadSanitizer)
        run: |
          set -euo pipefail
          for std in c++17 c++20; do
            g++ -std=$std -Wall -Wextra -Werror -pedantic -pthread \
              -Isrc/Systems tests/crossmap_aura_queue.cpp -o /tmp/xq_$std
            /tmp/xq_$std
          done
          g++ -std=c++17 -g -O1 -fsanitize=thread -pthread \
            -Isrc/Systems tests/crossmap_aura_queue.cpp -o /tmp/xq_tsan
          TSAN_OPTIONS=halt_on_error=1 /tmp/xq_tsan

  pinned-worldserver-link:
    needs: source-and-native
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout exact Grimfeather AzerothCore
        uses: actions/checkout@v4
        with:
          repository: Grimfeather/azerothcore-wotlk
          ref: 8daffdabe9202c228e45d833c9a1d399597a15cd
          path: acore
          persist-credentials: false
      - name: Checkout pinned Playerbots
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: d750b4b3a50effdf22bedc8032f0e8e5f7cb8091
          path: acore/modules/mod-playerbots
          persist-credentials: false
      - name: Checkout pinned Individual Progression
        uses: actions/checkout@v4
        with:
          repository: Grimfeather/mod-individual-progression
          ref: dd96f2b77e3ebfa2a4726bf785525ba133f1ab61
          path: acore/modules/mod-individual-progression
          persist-credentials: false
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/Mod-Naxxramas-Core
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: acore/modules/mod-naxxramas-core
          persist-credentials: false
      - name: Enforce exact snapshot SHAs and flag OFF
        run: |
          set -euo pipefail
          test "$(git -C acore rev-parse HEAD)" = 8daffdabe9202c228e45d833c9a1d399597a15cd
          test "$(git -C acore/modules/mod-playerbots rev-parse HEAD)" = d750b4b3a50effdf22bedc8032f0e8e5f7cb8091
          test "$(git -C acore/modules/mod-individual-progression rev-parse HEAD)" = dd96f2b77e3ebfa2a4726bf785525ba133f1ab61
          test "$(git -C acore/modules/mod-naxxramas-core rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          grep -Fqx 'NaxxramasCore.BotConsumables.CrossMapAuraSafety = 0' \
            acore/modules/mod-naxxramas-core/conf/mod_naxxramas_core.conf.dist
      - name: Install compiler dependencies on disposable runner
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git cmake ninja-build g++ make pkg-config file \
            libmysqlclient-dev libssl-dev libbz2-dev \
            libreadline-dev libncurses-dev libboost-all-dev
      - name: Configure full pinned Worldserver and all modules
        run: |
          cmake -S acore -B acore-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DMODULES=static -DSCRIPTS=static \
            -DAPPS_BUILD=world-only -DTOOLS_BUILD=none \
            -DUSE_COREPCH=ON -DUSE_SCRIPTPCH=ON
      - name: Compile the changed translation unit first
        run: |
          ninja -C acore-build \
            modules/CMakeFiles/modules.dir/mod-naxxramas-core/src/Systems/BotRaidConsumables.cpp.o
      - name: Build and link full Worldserver without launching
        run: cmake --build acore-build --target worldserver --parallel 2
      - name: Verify the consumables scripts are in the linked executable
        run: |
          set -euo pipefail
          binary=acore-build/src/server/apps/worldserver
          test -s "$binary" && test -x "$binary"
          nm -C --defined-only "$binary" > /tmp/naxx_xmap_symbols.txt
          grep -Eq " T AddBotRaidConsumablesScripts\(\)$" /tmp/naxx_xmap_symbols.txt
          grep -Fq "NaxxramasCoreBotRaidConsumablesWorld::OnUpdate(unsigned int)" /tmp/naxx_xmap_symbols.txt
          grep -Fq "NaxxramasCoreBotRaidConsumablesWorld::OnAfterConfigLoad(bool)" /tmp/naxx_xmap_symbols.txt
          echo "PASS linked: AddBotRaidConsumablesScripts + world-thread drain"
          echo "S4 build/link only. Not a runtime race-freedom or gameplay result."
