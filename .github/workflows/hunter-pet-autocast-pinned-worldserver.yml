name: A02 Hunter pet autocast pinned Worldserver link

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'src/Systems/HunterPetAutocast.cpp'
      - 'src/Systems/HunterPetAutocastPolicy.h'
      - 'src/NaxxramasCore_loader.cpp'
      - 'conf/mod_naxxramas_core.conf.dist'
      - 'tests/hunter_pet_autocast_policy.cpp'
      - 'tests/test_a02_hunter_autocast_functional_s2.py'
      - 'docs/research/a02-hunter-autocast-functional-s2.md'
      - '.github/workflows/hunter-pet-autocast-pinned-worldserver.yml'
  workflow_dispatch:

permissions:
  contents: read

# A success belongs to the SHA that was checked out. A later push does not
# cancel this run, and the job refuses a checkout that is not that SHA.
concurrency:
  group: hunter-pet-autocast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  source-and-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Source contract
        run: |
          python3 -m unittest discover -s tests -p 'test_a02_hunter_autocast_functional_s*.py' -v
      - name: Native policy tests (C++17, C++20)
        run: |
          set -euo pipefail
          for std in c++17 c++20; do
            g++ -std=$std -Wall -Wextra -Werror -pedantic \
              -Isrc/Systems tests/hunter_pet_autocast_policy.cpp -o /tmp/hunter_pet_$std
            /tmp/hunter_pet_$std
          done

  pinned-worldserver-link:
    needs: source-and-native
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout exact Grimfeather AzerothCore
        uses: actions/checkout@v4
        with:
          repository: Grimfeather/azerothcore-wotlk
          ref: 8daffdabe9202c228e45d833c9a1d399597a15cd
          path: acore
          persist-credentials: false
      - name: Checkout pinned Playerbots
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: d750b4b3a50effdf22bedc8032f0e8e5f7cb8091
          path: acore/modules/mod-playerbots
          persist-credentials: false
      - name: Checkout pinned Individual Progression
        uses: actions/checkout@v4
        with:
          repository: Grimfeather/mod-individual-progression
          ref: dd96f2b77e3ebfa2a4726bf785525ba133f1ab61
          path: acore/modules/mod-individual-progression
          persist-credentials: false
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/Mod-Naxxramas-Core
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: acore/modules/mod-naxxramas-core
          persist-credentials: false
      - name: Enforce exact snapshot SHAs and flag OFF
        run: |
          set -euo pipefail
          test "$(git -C acore rev-parse HEAD)" = 8daffdabe9202c228e45d833c9a1d399597a15cd
          test "$(git -C acore/modules/mod-playerbots rev-parse HEAD)" = d750b4b3a50effdf22bedc8032f0e8e5f7cb8091
          test "$(git -C acore/modules/mod-individual-progression rev-parse HEAD)" = dd96f2b77e3ebfa2a4726bf785525ba133f1ab61
          test "$(git -C acore/modules/mod-naxxramas-core rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          grep -Fqx 'NaxxramasCore.HunterPetAutocast.RestoreHumanChain = 0' \
            acore/modules/mod-naxxramas-core/conf/mod_naxxramas_core.conf.dist
      - name: Install compiler dependencies on disposable runner
        run: |
          set -euo pipefail
          # GitHub-hosted ubuntu-24.04 lists packages.microsoft.com, which
          # has returned 403 and fails apt-get update before CMake. This
          # job does not install Microsoft packages. Drop that source first.
          if [[ -f /etc/apt/sources.list ]]; then
            sudo sed -i '/packages\.microsoft\.com/d' /etc/apt/sources.list
          fi
          for list in /etc/apt/sources.list.d/*; do
            if [[ -f "$list" ]] && grep -q 'packages.microsoft.com' "$list"; then
              sudo rm -f "$list"
            fi
          done
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git cmake ninja-build g++ make pkg-config file \
            libmysqlclient-dev libssl-dev libbz2-dev \
            libreadline-dev libncurses-dev libboost-all-dev
      - name: Configure full pinned Worldserver and all modules
        run: |
          cmake -S acore -B acore-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DMODULES=static -DSCRIPTS=static \
            -DAPPS_BUILD=world-only -DTOOLS_BUILD=none \
            -DUSE_COREPCH=ON -DUSE_SCRIPTPCH=ON
      - name: Compile the new translation unit first
        run: |
          ninja -C acore-build \
            modules/CMakeFiles/modules.dir/mod-naxxramas-core/src/Systems/HunterPetAutocast.cpp.o
      - name: Build and link full Worldserver without launching
        run: cmake --build acore-build --target worldserver --parallel 2
      - name: Verify the script is in the linked executable
        run: |
          set -euo pipefail
          binary=acore-build/src/server/apps/worldserver
          test -s "$binary" && test -x "$binary"
          nm -C --defined-only "$binary" > /tmp/naxx_a02_symbols.txt
          grep -F ' T AddHunterPetAutocastScripts()' /tmp/naxx_a02_symbols.txt
          grep -F 'NaxxramasHunterPetAutocastSnapshotScript::OnUnitUpdate' /tmp/naxx_a02_symbols.txt
          grep -F 'NaxxramasHunterPetAutocastRestoreScript::OnWorldObjectUpdate' /tmp/naxx_a02_symbols.txt
          echo "PASS linked: AddHunterPetAutocastScripts + both update hooks"
          echo "The binary stays on the runner and is not uploaded."
          echo "Public-pin link only. Not an in-game result and not an owner-installed build."
