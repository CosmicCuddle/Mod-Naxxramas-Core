name: P13-R3 Playerbots masked bulk logout source witness

on:
  pull_request:
    paths:
      - 'tests/test_p13_playerbots_masked_bulk_logout_source.py'
      - '.github/workflows/naxx-p13-masked-logout-source.yml'
  push:
    branches:
      - 'test/cs01-p13-masked-logout-lifecycle-20261028'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-bulk-logout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify P13-R3 exact two new test paths and unchanged production
        shell: bash
        run: |
          set -euo pipefail
          BASE=49cb8de625d55399b6eca71c16e1a3f6cfbd2ec1
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD > /tmp/p13-r3-changed
          printf '%s\n' \
            '.github/workflows/naxx-p13-masked-logout-source.yml' \
            'tests/test_p13_playerbots_masked_bulk_logout_source.py' > /tmp/p13-r3-expected
          diff -u /tmp/p13-r3-expected /tmp/p13-r3-changed
          for path in \
            src/Systems/HonorOverflow.cpp \
            conf/mod_naxxramas_core.conf.dist \
            tests/test_honoroverflow_masked_bot_source_witness.py \
            tests/test_p13_playerbots_reload_transition_source.py \
            tests/test_p13_playerbots_masked_destruction_source.py; do
            test "$(git show "$BASE":"$path" | sha256sum | cut -d' ' -f1)" = \
                 "$(sha256sum "$path" | cut -d' ' -f1)"
          done
      - uses: actions/checkout@v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: d750b4b3a50effdf22bedc8032f0e8e5f7cb8091
          path: pinned-playerbots
          fetch-depth: 1
          sparse-checkout: |
            src/Bot/PlayerbotMgr.cpp
            src/Bot/RandomPlayerbotMgr.cpp
            src/Script/Playerbots.cpp
          sparse-checkout-cone-mode: false
      - name: Strict C++17 and C++20 pinned-bulk-logout source fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pinned-playerbots rev-parse HEAD)" = \
               "d750b4b3a50effdf22bedc8032f0e8e5f7cb8091"
          python3 -m py_compile tests/test_p13_playerbots_masked_bulk_logout_source.py
          python3 tests/test_p13_playerbots_masked_bulk_logout_source.py
