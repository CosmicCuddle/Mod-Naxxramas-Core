name: P13-R1 pinned Playerbots reload-to-mask conditional source test

on:
  pull_request:
    paths:
      - 'tests/test_p13_playerbots_reload_transition_source.py'
      - '.github/workflows/naxx-p13-reload-transition-source.yml'
  push:
    branches:
      - 'test/cs01-p13-reload-transition-default-audit-20261028'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-pinned-reload-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Protect original P13 witness and exact two-path scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=e2b54e4bde6f375006d86c127bdf515cf2e483b0
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD > /tmp/p13-r1-changed
          printf '%s\n' \
            '.github/workflows/naxx-p13-reload-transition-source.yml' \
            'tests/test_p13_playerbots_reload_transition_source.py' > /tmp/p13-r1-allowed
          diff -u /tmp/p13-r1-allowed /tmp/p13-r1-changed
          for path in \
            src/Systems/HonorOverflow.cpp \
            conf/mod_naxxramas_core.conf.dist \
            tests/test_honoroverflow_masked_bot_source_witness.py; do
            test "$(git show "$BASE":"$path" | sha256sum | cut -d' ' -f1)" = \
                 "$(sha256sum "$path" | cut -d' ' -f1)"
          done
      - uses: actions/checkout@v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: d750b4b3a50effdf22bedc8032f0e8e5f7cb8091
          path: pinned-playerbots
          fetch-depth: 1
          sparse-checkout: |
            src/Bot/PlayerbotMgr.cpp
            src/Bot/RandomPlayerbotMgr.cpp
            src/PlayerbotAIConfig.cpp
          sparse-checkout-cone-mode: false
      - name: Execute genuine getter plus extracted disabled reload prologue
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pinned-playerbots rev-parse HEAD)" = \
               "d750b4b3a50effdf22bedc8032f0e8e5f7cb8091"
          python3 -m py_compile tests/test_p13_playerbots_reload_transition_source.py
          python3 tests/test_p13_playerbots_reload_transition_source.py
