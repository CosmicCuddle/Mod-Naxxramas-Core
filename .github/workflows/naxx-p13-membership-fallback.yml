name: P13-R6 pinned Playerbots Random/AddClass membership fallback

on:
  push:
    branches:
      - 'test/cs01-p13-membership-fallback-20261028'
  pull_request:
    paths:
      - 'tests/test_p13_membership_fallback_source.py'
      - '.github/workflows/naxx-p13-membership-fallback.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source-membership:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce exact P13-R5 ancestor and two added test-only files
        shell: bash
        run: |
          set -euo pipefail
          BASE=8ccf3f480eecd70490631f6268845fc5e1bac897
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD > /tmp/r6-paths
          printf '%s\n' \
            '.github/workflows/naxx-p13-membership-fallback.yml' \
            'tests/test_p13_membership_fallback_source.py' > /tmp/r6-allowed
          diff -u /tmp/r6-allowed /tmp/r6-paths
          for path in \
            src/Systems/HonorOverflow.cpp \
            conf/mod_naxxramas_core.conf.dist \
            tests/test_honoroverflow_masked_bot_source_witness.py \
            tests/test_p13_playerbots_reload_transition_source.py \
            tests/test_p13_playerbots_masked_destruction_source.py \
            tests/test_p13_playerbots_masked_bulk_logout_source.py \
            tests/test_p13_identity_helpers_config_mask_source.py \
            tests/test_p13_headless_identity_source.py; do
            test "$(git show "$BASE":"$path" | sha256sum | cut -d' ' -f1)" = \
                 "$(sha256sum "$path" | cut -d' ' -f1)"
          done
      - uses: actions/checkout@v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: d750b4b3a50effdf22bedc8032f0e8e5f7cb8091
          path: pinned-playerbots
          fetch-depth: 1
          sparse-checkout: |
            src/Bot/PlayerbotAI.cpp
            src/Bot/PlayerbotMgr.cpp
            src/Bot/RandomPlayerbotMgr.cpp
            src/PlayerbotAIConfig.cpp
          sparse-checkout-cone-mode: false
      - name: Run actual pinned C++20 Random/AddClass membership source fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pinned-playerbots rev-parse HEAD)" = \
               d750b4b3a50effdf22bedc8032f0e8e5f7cb8091
          python3 -m py_compile tests/test_p13_membership_fallback_source.py
          python3 tests/test_p13_membership_fallback_source.py
