name: Mail item-only delay pinned Worldserver link

on:
  push:
    branches: [feature/alt-mail-item-only-delay-20261114]
    paths:
      - 'src/Systems/AltMailDelay.cpp'
      - 'tests/test_alt_mail_delay_source.py'
      - '.github/workflows/mail-item-only-delay-worldserver-link.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linked-worldserver:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - name: Checkout exact Cosmic Core mail branch
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/azerothcore-wotlk
          ref: f97fef89ff07f29ecea563edbc729706badcf6ff
          path: acore
          persist-credentials: false

      - name: Checkout exact synced Playerbots
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/mod-playerbots
          ref: 3a9e39f1be9f988ce53f9d4f19636207ff25c4a9
          path: acore/modules/mod-playerbots
          persist-credentials: false

      - name: Checkout exact synced Individual Progression
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/mod-individual-progression
          ref: 05ff032b625f6e8abb6b2b5be496bb8a3ee65c96
          path: acore/modules/mod-individual-progression
          persist-credentials: false

      - name: Checkout exact synced Character Services
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/mod-character-services
          ref: f43bc2c98aa7a291b673158fd578be304607b5e1
          path: acore/modules/mod-character-services
          persist-credentials: false

      - name: Checkout exact Naxxramas mail branch
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/Mod-Naxxramas-Core
          ref: ${{ github.sha }}
          path: acore/modules/mod-naxxramas-core
          persist-credentials: false

      - name: Confirm exact source tuple
        run: |
          set -euo pipefail
          test "$(git -C acore rev-parse HEAD)" = "f97fef89ff07f29ecea563edbc729706badcf6ff"
          test "$(git -C acore/modules/mod-playerbots rev-parse HEAD)" = "3a9e39f1be9f988ce53f9d4f19636207ff25c4a9"
          test "$(git -C acore/modules/mod-individual-progression rev-parse HEAD)" = "05ff032b625f6e8abb6b2b5be496bb8a3ee65c96"
          test "$(git -C acore/modules/mod-character-services rev-parse HEAD)" = "f43bc2c98aa7a291b673158fd578be304607b5e1"
          test "$(git -C acore/modules/mod-naxxramas-core rev-parse HEAD)" = "${{ github.sha }}"

      - name: Run mail source contract
        run: python3 -B -m unittest acore.modules.mod-naxxramas-core.tests.test_alt_mail_delay_source

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends             git cmake ninja-build g++ make pkg-config file             libmysqlclient-dev libssl-dev libbz2-dev             libreadline-dev libncurses-dev libboost-all-dev

      - name: Configure full static scripts/modules
        run: |
          cmake -S acore -B acore-build -G Ninja             -DCMAKE_BUILD_TYPE=Release -DMODULES=static -DSCRIPTS=static             -DAPPS_BUILD=world-only -DTOOLS_BUILD=none             -DUSE_COREPCH=ON -DUSE_SCRIPTPCH=ON

      - name: Build and link Worldserver only
        run: cmake --build acore-build --target worldserver --parallel 2

      - name: Record linked binary evidence
        run: |
          set -euo pipefail
          binary="$(find acore-build -type f -name worldserver -print -quit)"
          test -n "$binary"
          test -s "$binary"
          test -x "$binary"
          file "$binary"
          sha256sum "$binary"
          echo "PASS: Core MailDraft::HasItems + Naxx item-only delay composed and linked."
          echo "No server startup, DB/config migration, or production deployment."
