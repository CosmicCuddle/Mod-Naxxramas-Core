name: F15 S4c offline immutable error reports (NO HOST)

on:
  pull_request:
    paths:
      - "tools/f15/offline_error_reports.py"
      - "tests/test_f15_error_reports_s4c.py"
      - "docs/research/F15-S4C-OFFLINE-ERROR-REPORTS.md"
      - "docs/research/F15-S4B-OFFLINE-ERROR-BURSTS.md"
      - ".github/workflows/f15-error-reports-s4c.yml"
      - "tools/f15/offline_store.py"
      - "tools/f15/offline_restart.py"
      - "tools/f15/offline_error_bursts.py"
      - "tools/f15/offline_exit_evidence.py"
      - "tests/test_f15_offline_store_s2.py"
      - "tests/test_f15_restart_sidecar_s3.py"
      - "tests/test_f15_exit_evidence_s4.py"
      - "tests/test_f15_error_bursts_s4b.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert pinned exact PR HEAD
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Compile offline source only
        run: python3 -m py_compile tools/f15/offline_error_reports.py tests/test_f15_error_reports_s4c.py
      - name: Test immutable offline warning reports
        run: python3 -m unittest -v tests.test_f15_error_reports_s4c
      - name: Preserve S4b bounded warning burst contract
        run: python3 -m unittest -v tests.test_f15_error_bursts_s4b
      - name: Preserve S4 actual-child fixture admission
        run: python3 -m unittest -v tests.test_f15_exit_evidence_s4
      - name: Preserve S3 restart history
        run: python3 -m unittest -v tests.test_f15_restart_sidecar_s3
      - name: Preserve S2 immutable crash storage
        run: python3 -m unittest -v tests.test_f15_offline_store_s2
      - name: No live server, root directory, read-only discovery or deployment
        run: |
          test ! -e tools/f15/live_supervisor.py
          echo "PASS: synthetic fixture tests only; NO root, Linux monitor or Worldserver"
