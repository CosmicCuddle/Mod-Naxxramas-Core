name: F15 S4g owned-child kernel wait witness (NO HOST)

on:
  push:
    branches:
      - cs01/f15-s4g-kernel-owned-child-exit-offline-part24
  pull_request:
    paths:
      - tools/f15/offline_kernel_wait_s4g.py
      - tests/test_f15_offline_kernel_wait_s4g.py
      - .github/workflows/f15-s4g-kernel-wait-fixture.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run ONLY synthetic Python owned-child tests; no server process
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          PYTHONPATH=tools/f15 python3 -W error -m unittest discover \
            -s tests -p 'test_f15_offline_kernel_wait_s4g.py' -v
      - name: Clarify nonproduction scope
        run: |
          echo 'Fixture launches only isolated Python children, not Worldserver or Authserver.'
          echo 'Kernel waitpid is genuine for fixture children only; no GDB, restart, root, owner host or reports.'
