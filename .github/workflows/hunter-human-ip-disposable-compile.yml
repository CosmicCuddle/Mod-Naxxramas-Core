name: Human Hunter IP proposal disposable C++ compile — module-owned CI only

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'proposals/hunter-player-ip-autocast-legal-rank-review-only.patch'
      - 'scripts/compile_hunter_human_ip_disposable_tu.py'
      - 'docs/HUNTER-PET-HUMAN-IP-DISPOSABLE-COMPILE-2026-10-19.md'
      - '.github/workflows/hunter-human-ip-disposable-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hunter-human-ip-disposable-compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proposed-ip-translation-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - name: Checkout exact pinned owner AzerothCore
        uses: actions/checkout@v4
        with:
          repository: Grimfeather/azerothcore-wotlk
          ref: a66f1bede6f5d905d9ab815715b4e2ee1c1f48e7
          path: acore
          persist-credentials: false

      - name: Checkout exact pinned Playerbots for build compatibility only
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: 037c01418b5d01506917a3db9b44fd56ac5f965c
          path: acore/modules/mod-playerbots
          persist-credentials: false

      - name: Checkout unmodified pinned Individual Progression
        uses: actions/checkout@v4
        with:
          repository: Grimfeather/mod-individual-progression
          ref: 4ff4b5fcc1480348f058c632573143e62d4e3a41
          path: acore/modules/mod-individual-progression
          persist-credentials: false

      - name: Checkout THIS Naxxramas Core review candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: acore/modules/mod-naxxramas-core
          persist-credentials: false

      - name: Confirm exact pinned source revisions
        run: |
          set -euo pipefail
          test "$(git -C acore rev-parse HEAD)" = "a66f1bede6f5d905d9ab815715b4e2ee1c1f48e7"
          test "$(git -C acore/modules/mod-playerbots rev-parse HEAD)" = "037c01418b5d01506917a3db9b44fd56ac5f965c"
          test "$(git -C acore/modules/mod-individual-progression rev-parse HEAD)" = "4ff4b5fcc1480348f058c632573143e62d4e3a41"
          test "$(git -C acore/modules/mod-naxxramas-core rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test -z "$(git -C acore/modules/mod-individual-progression status --porcelain --untracked-files=no)"

      - name: Apply module-owned proposal ONLY to disposable CI IP checkout
        run: |
          set -euo pipefail
          ip="acore/modules/mod-individual-progression"
          patch="$GITHUB_WORKSPACE/acore/modules/mod-naxxramas-core/proposals/hunter-player-ip-autocast-legal-rank-review-only.patch"
          git -C "$ip" apply --check "$patch"
          git -C "$ip" apply "$patch"
          git -C "$ip" diff --check
          test "$(git -C "$ip" diff --name-only)" = "src/IndividualProgressionSpells.cpp"
          echo "Ephemeral CI clone has exactly one modified IP C++ file. NO commit, push, upload or deployment."

      - name: Install disposable pinned Worldserver C++ build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git cmake ninja-build g++ make pkg-config file \
            libmysqlclient-dev libssl-dev libbz2-dev \
            libreadline-dev libncurses-dev libboost-all-dev

      - name: Configure pinned AzerothCore build with review patch only in CI
        run: |
          cmake -S acore -B acore-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DMODULES=static -DSCRIPTS=static \
            -DAPPS_BUILD=world-only -DTOOLS_BUILD=none \
            -DUSE_COREPCH=ON -DUSE_SCRIPTPCH=ON

      - name: Compile REAL modified IndividualProgressionSpells C++ unit
        run: |
          python3 acore/modules/mod-naxxramas-core/scripts/compile_hunter_human_ip_disposable_tu.py \
            --ip-root acore/modules/mod-individual-progression \
            --compile-commands acore-build/compile_commands.json --timeout 420

      - name: Link full pinned Worldserver without launching or installing it
        run: cmake --build acore-build --target worldserver --parallel 2

      - name: Verify isolated linked Worldserver retains Naxx observer
        run: |
          set -euo pipefail
          binary="$(find acore-build -type f -name worldserver -print -quit)"
          test -n "$binary"
          test -s "$binary"
          grep -aFq "NaxxramasHunterPetAutocastPacketObserver" "$binary"
          echo "PASS: disposable patched-IP checkout linked a pinned Worldserver retaining the Naxx observer."
          echo "Executable will not be run, exported, installed or deployed."

      - name: Restore ephemeral IP source and assert no tracked changes
        if: always()
        run: |
          set -euo pipefail
          ip="acore/modules/mod-individual-progression"
          git -C "$ip" restore --source=HEAD -- src/IndividualProgressionSpells.cpp
          test -z "$(git -C "$ip" status --porcelain --untracked-files=no)"
          test "$(git -C "$ip" rev-parse HEAD)" = "4ff4b5fcc1480348f058c632573143e62d4e3a41"
          echo "PASS: disposable IP copy restored. No upstream commit/push, installed realm, DB, or runtime mutation."

      - name: State compile-only limitations
        if: always()
        run: |
          echo "Exact modified IP translation unit AND full pinned Worldserver link are attempted in CI; no server launch."
          echo "This workflow is stored solely inside Mod-Naxxramas-Core."
          echo "Proposed IP edit was applied and restored in a disposable CI checkout only."
          echo "Not evidence of a module-only runtime implementation or functional pet autocast persistence."
